<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barkod Sistemi</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F1A2E">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Barkod">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{--bg:#EEF1F5;--surf:#FFFFFF;--surf2:#F7F8FA;--line:#E2E6EC;--line2:#CBD2DC;--tx:#14181F;--tx2:#3A4556;--tx3:#5A6578;--panel:#0F1A2E;--acc:#1F5FD6;--ok:#157347;--okTx:#136334;--okSoft:#E7F6EE;--bad:#C92A2A;--badTx:#A61E1E;--badSoft:#FDE8E8;--warn:#B8440A;--warnTx:#8A3A08;--warnSoft:#FDEDE3;--vio:#5B3FC4;--org:#E8590C;--fs:16px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1219;--surf:#161D29;--surf2:#1C2533;--line:#263042;--line2:#36445C;--tx:#E8ECF2;--tx2:#C3CCD9;--tx3:#98A5B8;--panel:#090E16;--okTx:#78D9A3;--okSoft:#12301F;--badTx:#FF9B9B;--badSoft:#3A1A1C;--warnTx:#FFB27D;--warnSoft:#3A2414;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1219;--surf:#161D29;--surf2:#1C2533;--line:#263042;--line2:#36445C;--tx:#E8ECF2;--tx2:#C3CCD9;--tx3:#98A5B8;--panel:#090E16;--okTx:#78D9A3;--okSoft:#12301F;--badTx:#FF9B9B;--badSoft:#3A1A1C;--warnTx:#FFB27D;--warnSoft:#3A2414;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);font-size:var(--fs)}
html,body{height:100%;margin:0}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;font-size:1rem;-webkit-tap-highlight-color:transparent}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
#app{height:100%;display:flex;flex-direction:column}
.soft{background:color-mix(in srgb,var(--acc) 12%,var(--surf))}
/* buttons */
.btn{min-height:44px;padding:0 16px;border:1.5px solid var(--line2);border-radius:10px;background:var(--surf);font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.btn.okb{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
.btn.danger{border-color:var(--bad);color:var(--badTx);font-weight:700}
.btn.sm{min-height:36px;padding:0 12px;font-size:.82rem}
.ib{width:40px;height:40px;border:1px solid var(--line2);border-radius:9px;background:var(--surf);display:inline-flex;align-items:center;justify-content:center;font-size:1.1rem;padding:0}
.ib.ghost{border:0;background:transparent;color:var(--tx3)}
input.in,select.in{width:100%;min-height:46px;padding:0 12px;border:1.5px solid var(--line2);border-radius:10px;background:var(--surf);font-size:1rem}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.82rem;font-weight:600;color:var(--tx2)}
.seg{display:inline-flex;gap:4px;padding:4px;background:color-mix(in srgb,var(--tx) 8%,var(--surf));border-radius:10px;flex-wrap:wrap}
.seg button{min-height:36px;padding:0 12px;border:0;border-radius:8px;background:transparent;font-size:.82rem;font-weight:600;color:var(--tx2)}
.seg button.on{background:var(--surf);color:var(--tx);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.chip{display:inline-flex;align-items:center;min-height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:var(--surf2);font-size:.82rem;font-weight:600;color:var(--tx2)}
.chip.on{background:color-mix(in srgb,var(--acc) 14%,var(--surf));border-color:color-mix(in srgb,var(--acc) 40%,var(--surf));color:var(--tx)}
.tag{font-size:.75rem;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
.t-Nakit{background:var(--okSoft);color:var(--okTx)}.t-Kart{background:color-mix(in srgb,var(--acc) 14%,var(--surf));color:var(--tx)}.t-Havale{background:color-mix(in srgb,var(--vio) 16%,var(--surf));color:var(--tx)}.t-Veresiye{background:var(--warnSoft);color:var(--warnTx)}.t-Parçalı{background:var(--surf2);color:var(--tx2)}.t-iade{background:var(--badSoft);color:var(--badTx)}
.card{background:var(--surf);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
h1{margin:0;font-size:1.6rem;font-weight:800;letter-spacing:-.4px}
h2{margin:0;font-size:1rem;font-weight:800}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{margin-left:auto}
.muted{color:var(--tx3);font-size:.85rem}
.kbd{font-family:'JetBrains Mono',monospace;font-size:.7rem;font-weight:700;padding:2px 6px;border:1px solid var(--line2);border-radius:5px;color:var(--tx3)}
/* login */
.login{min-height:100%;display:grid;grid-template-columns:1fr 1fr}
.login .lp{background:var(--panel);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.login .lp h1{font-size:2.4rem;line-height:1.15;color:#fff}
.login .lf{display:flex;align-items:center;justify-content:center;padding:32px 20px}
.login .box{width:100%;max-width:440px;display:flex;flex-direction:column;gap:18px}
.logo{display:flex;align-items:center;gap:12px;font-weight:800;font-size:1.2rem}
.logo i{width:44px;height:44px;border-radius:11px;background:var(--acc);display:flex;align-items:center;justify-content:center}
.users{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.user{min-height:56px;border:1.5px solid var(--line2);border-radius:12px;background:var(--surf);display:flex;align-items:center;gap:10px;padding:0 12px;font-weight:600;text-align:left}
.user.on{border:2px solid var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--surf));font-weight:700}
.av{width:34px;height:34px;border-radius:50%;background:color-mix(in srgb,var(--tx) 10%,var(--surf));display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:800;flex:none}
.user.on .av{background:var(--acc);color:#fff}
.err{color:var(--badTx);font-weight:700;font-size:.9rem}
@media (max-width:820px){.login{grid-template-columns:1fr}.login .lp{padding:28px 22px;border-radius:0 0 24px 24px}.login .lp h1{font-size:1.6rem}.login .lp .big{display:none}}
/* top bar */
.top{background:var(--panel);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 14px;flex:none}
.top .tb{min-height:44px;padding:0 14px;border:0;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;font-weight:700;display:flex;align-items:center;gap:8px}
.top .brand{font-weight:800;white-space:nowrap}
.scan{flex:1;position:relative;display:flex;align-items:center;gap:10px;min-height:46px;padding:0 12px;background:var(--surf);color:var(--tx3);border-radius:10px;min-width:0}
.scan input{flex:1;border:0;outline:0;background:transparent;color:var(--tx);font-size:1rem;min-width:0;height:44px}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surf);color:var(--tx);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:30;overflow:hidden}
.sugg button{display:flex;width:100%;justify-content:space-between;gap:10px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left}
.sugg button:hover{background:var(--surf2)}
.ordb{min-height:44px;padding:0 14px;border:0;border-radius:10px;background:var(--org);color:#fff;font-weight:700;display:flex;align-items:center;gap:8px;white-space:nowrap}
.ordb b{background:#fff;color:#A53F08;border-radius:10px;padding:0 8px;font-size:.8rem}
.who{text-align:right;line-height:1.25;white-space:nowrap;font-size:.85rem;font-weight:700}
.who small{color:#C9D3E3;font-weight:500}
/* POS */
.pos{flex:1;min-height:0;display:grid;grid-template-columns:1fr minmax(320px,400px) 330px;grid-template-areas:"cart quick pay";gap:12px;padding:12px}
.cart{grid-area:cart;padding:0;overflow:hidden}
.quick{grid-area:quick;min-height:0}
.pay{grid-area:pay;display:flex;flex-direction:column;gap:12px;min-height:0}
.ctabs{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.ctabs button{min-height:38px;padding:0 14px;border:1px solid var(--line2);border-radius:8px;background:var(--surf);font-weight:600;font-size:.85rem;white-space:nowrap}
.ctabs button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.rethead{background:var(--bad);color:#fff;padding:8px 14px;font-weight:800;display:flex;align-items:center;gap:10px;flex:none}
.lh,.ln{display:grid;grid-template-columns:1fr 132px 84px 96px 40px;gap:8px;align-items:center;padding:9px 14px}
.lh{font-size:.72rem;font-weight:700;color:var(--tx3);background:var(--surf2);flex:none}
.lines{flex:1;overflow-y:auto;min-height:0}
.ln{border-bottom:1px solid var(--line);cursor:pointer}
.ln.sel{background:color-mix(in srgb,var(--acc) 10%,var(--surf))}
.ln .nm{font-weight:700;font-size:.95rem}
.ln .bc2{font-size:.72rem;color:var(--tx3)}
.qty{display:flex;align-items:center;justify-content:center;gap:4px}
.qty button{width:36px;height:36px;border:1px solid var(--line2);border-radius:8px;background:var(--surf);font-size:1.1rem;padding:0}
.qty span{min-width:34px;text-align:center;font-weight:800}
.r{text-align:right}
.empty{padding:40px 20px;text-align:center;color:var(--tx3)}
.cfoot{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);background:var(--surf2);flex-wrap:wrap;flex:none}
.qgrid{flex:1;display:grid;grid-template-columns:repeat(var(--cols,3),1fr);grid-auto-rows:minmax(84px,auto);gap:8px;overflow-y:auto;min-height:0;align-content:start}
.qp{border:1px solid var(--line);border-radius:10px;background:var(--surf2);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:10px;text-align:left;min-height:74px}
.qp b{font-size:.88rem}.qp span{color:var(--acc);font-weight:800;font-size:.88rem}
.qp:active{transform:scale(.97)}
.tot{background:var(--panel);color:#fff;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px}
.tot .l{display:flex;justify-content:space-between;font-size:.88rem;color:#C9D3E3}
.tot .big{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px}
.tot .big b{font-size:2.4rem;letter-spacing:-1px}
.ret .tot{background:var(--bad)}
.paygrid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:minmax(64px,1fr) minmax(64px,1fr) auto;gap:10px}.paygrid .btn{min-height:50px}
.pb{border:0;border-radius:12px;color:#fff;font-size:1.2rem;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.pb small{font-family:'JetBrains Mono',monospace;font-size:.7rem;opacity:.85;font-weight:500}
.aux{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.aux button{min-height:54px;border:1.5px solid var(--line2);border-radius:10px;background:var(--surf);font-weight:700;font-size:.85rem;display:flex;flex-direction:column;align-items:center;justify-content:center}
.aux button small{font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--tx3);font-weight:500}
.aux .rb{border-color:var(--bad);color:var(--badTx)}
.aux .rb.on{background:var(--bad);color:#fff}.aux .rb.on small{color:#fff}
.keys{background:var(--surf);border-top:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 14px;min-height:42px;font-size:.8rem;color:var(--tx2);white-space:nowrap;overflow-x:auto;flex:none}
.keys b{font-family:'JetBrains Mono',monospace}
.mbar{display:none}
@media (max-width:1250px){.pos{grid-template-columns:1fr 330px;grid-template-areas:"cart pay" "quick pay";grid-template-rows:1.2fr 1fr}}
@media (max-width:820px){
 html,body,#app{height:auto}
 .top{flex-wrap:wrap}.top .scan{order:5;flex-basis:100%}.who{display:none}.top .brand{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}.ordb{padding:0 10px}#toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
 .pos{display:flex;flex-direction:column;padding:10px}
 .cart{order:1;min-height:240px}.quick{order:2}.pay{order:3}
 .qgrid{grid-template-columns:repeat(3,1fr);max-height:340px}
 .lh{display:none}.ln{grid-template-columns:1fr auto auto;grid-template-areas:"nm nm del" "qt pr tt"}
 .ln .c1{grid-area:nm}.ln .c2{grid-area:qt;justify-content:flex-start}.ln .c3{grid-area:pr;color:var(--tx3)}.ln .c4{grid-area:tt}.ln .c5{grid-area:del}
 .lines{max-height:none}
 .keys{display:none}
 .mbar{display:flex;position:sticky;bottom:0;z-index:20;background:var(--panel);color:#fff;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));align-items:center;gap:12px}
 .mbar b{font-size:1.5rem}
}
/* shell */
.shell{flex:1;min-height:0;display:grid;grid-template-columns:270px 1fr}
.side{background:var(--panel);color:#fff;display:flex;flex-direction:column;padding:14px 12px;gap:2px;overflow-y:auto;z-index:50}
.side a{display:flex;align-items:center;gap:10px;min-height:42px;padding:0 10px;border-radius:8px;color:#fff;text-decoration:none;font-size:.9rem;font-weight:500}
.side a.on{background:rgba(255,255,255,.13);font-weight:700}
.side a .bdg{margin-left:auto;background:var(--org);border-radius:10px;padding:0 8px;font-size:.75rem;font-weight:700}
.side a.sub{min-height:34px;padding-left:40px;font-size:.82rem;color:#B5C2D6}
.side a.sub.on{background:var(--acc);color:#fff;font-weight:700}
.side .lo{margin-top:auto;padding:12px 10px 0;border-top:1px solid rgba(255,255,255,.14);font-size:.85rem;color:#B5C2D6;display:flex;align-items:center;gap:8px}
.side .lo button{margin-left:auto;background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:8px;min-height:36px;padding:0 12px;font-weight:700}
.scrim{display:none}
.main{min-width:0;overflow-y:auto;padding:22px 24px;display:flex;flex-direction:column;gap:16px}
.mtop{display:none}
.drawer .side{position:fixed;left:0;top:0;bottom:0;width:290px;transform:translateX(-105%);transition:transform .2s ease;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.drawer.open .side{transform:none}
.drawer.open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:45}
@media (max-width:1100px){
 .shell{grid-template-columns:1fr}
 .shell .side{position:fixed;left:0;top:0;bottom:0;width:290px;transform:translateX(-105%);transition:transform .2s ease;padding-top:calc(14px + env(safe-area-inset-top,0px))}
 .shell.open .side{transform:none}
 .shell.open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:45}
 .mtop{display:flex;position:sticky;top:0;z-index:20}
 .main{padding:16px 14px}
}
@media (max-width:820px){.shell{display:block}.main{overflow:visible}}
@media (pointer:coarse){.kbd{display:none}}
@media (prefers-reduced-motion:reduce){.side{transition:none!important}}
/* tables */
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem;min-width:560px}
.tbl th{font-size:.72rem;font-weight:700;color:var(--tx3);text-align:left;padding:10px;background:var(--surf2)}
.tbl td{padding:10px;border-bottom:1px solid var(--line)}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--surf2)}
.tbl .r{text-align:right}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.kpi{background:var(--surf);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi span{font-size:.8rem;font-weight:600;color:var(--tx3)}.kpi b{font-size:1.45rem;letter-spacing:-.4px}
.bars{display:flex;align-items:flex-end;gap:12px;height:200px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:.72rem;color:var(--tx3);font-weight:600}
.bars i{display:block;width:100%;background:color-mix(in srgb,var(--acc) 35%,var(--surf));border-radius:6px 6px 2px 2px;min-height:2px}
.bars div.today i{background:var(--acc)}
.shr{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:600}
.shr .bar{height:10px;background:var(--surf2);border-radius:5px;overflow:hidden}.shr .bar i{display:block;height:100%;border-radius:5px}
@media (max-width:1250px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media (max-width:820px){.kpis{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}h1{font-size:1.35rem}}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-weight:600;font-size:.92rem;cursor:pointer}
.tgl small{display:block;color:var(--tx3);font-weight:500;font-size:.78rem}
.sw{width:48px;height:28px;border-radius:14px;background:var(--line2);padding:3px;display:flex;flex:none;transition:background .15s}
.sw i{width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.sw.on{background:var(--acc)}.sw.on i{transform:translateX(20px)}
.swatch{width:42px;height:42px;border-radius:50%;border:3px solid transparent}
.swatch.on{border-color:var(--tx)}
.ord{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--surf)}
/* modal & toast */
.ov{position:fixed;inset:0;background:rgba(5,10,20,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.mb{background:var(--surf);border-radius:16px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.mb.wide{max-width:820px}
@media (max-width:600px){.ov{align-items:flex-end;padding:0}.mb{border-radius:18px 18px 0 0;max-height:92vh;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast div{background:var(--tx);color:var(--surf);padding:12px 18px;border-radius:10px;font-weight:700;font-size:.9rem;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.receipt{font-family:'JetBrains Mono',monospace;font-size:.8rem;background:#fff;color:#111;padding:16px;border:1px dashed #999;border-radius:6px;line-height:1.5}
.receipt .rl{display:flex;justify-content:space-between;gap:8px}
.labels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#fff;color:#111;padding:12px;border-radius:8px}
.lbl{border:1px dashed #aaa;border-radius:4px;padding:8px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;font-size:.75rem}
.lbl b{font-size:1.05rem}
.bc{width:100%;height:38px;fill:#111}.bcn{font-size:.65rem;letter-spacing:1px}
@media print{body *{visibility:hidden}.printme,.printme *{visibility:visible}.printme{position:absolute;left:0;top:0;width:100%}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast" aria-live="polite"></div>
<script>
'use strict';
const KEY='barkod_test_v1';
const $=s=>document.querySelector(s);

const MENU=[['satis','Satış ekranı',0],['siparis','Gelen siparişler',0],['rapor','Raporlar',1,[['Genel bakış','rapor',{rTab:'urun'}],['Kasiyer performansı','rapor',{rTab:'kasiyer'}],['Gün sonu (Z raporu)','zrap']]],['urun','Ürünler',1,[['Ürün listesi','urun',{uTab:'urun'}],['Kategoriler','urun',{uTab:'cats'}],['Markalar','urun',{uTab:'brands'}],['Etiketler','urun',{uTab:'tags'}],['Barkod etiketi yazdır','etiket']]],['stok','Stok',1,[['Stok durumu','stok',{sf:'Tümü'}],['Kritik stok','stok',{sf:'Kritik'}],['Mal alışları','alis']]],['gecmis','Satış geçmişi',0,[['Fişler','gecmis',{gTyp:'Tümü'}],['İadeler','gecmis',{gTyp:'İade'}]]],['musteri','Müşteriler',0,[['Müşteri listesi','musteri',{mf:'Tümü'}],['Veresiye hesapları','musteri',{mf:'Borçlu'}]]],['tedarik','Tedarikçiler',1],['gider','Giderler',1],['kasa','Kasa işlemleri',1],['personel','Personel ve yetkiler',1],['ayar','Ayarlar',1]];
const GRP={zrap:'rapor',etiket:'urun',alis:'stok'};
function sideHTML(){
 const yeni=D.orders.filter(o=>o.st==='Yeni').length;const g=GRP[S.page]||S.page;
 let h=`<div class="logo" style="padding:4px 8px 14px;font-size:1rem"><i style="width:36px;height:36px">${ic('satis',20)}</i>${esc(D.set.market)}</div>`;
 for(const [k,l,y,subs] of MENU){if(y&&!isY())continue;
  h+=`<a href="#" class="${g===k?'on':''}" onclick="event.preventDefault();nav('${k}')">${ic(k,18)}${l}${k==='siparis'&&yeni?`<span class="bdg">${yeni}</span>`:''}${subs?`<span style="margin-left:${k==='siparis'?'8px':'auto'};color:#9FB0C9;font-size:.7rem">${g===k?'▾':'▸'}</span>`:''}</a>`;
  if(subs&&g===k)for(const [sl,pg,opt] of subs){const on=pg===S.page&&(!opt||Object.keys(opt).every(x=>S[x]===opt[x]));h+=`<a href="#" class="sub ${on?'on':''}" onclick='event.preventDefault();nav("${pg}",${JSON.stringify(opt||{})})'>${sl}</a>`}
 }
 h+=`<div class="lo">${ic('user',16)}${esc(S.user.name)} · ${isY()?'Yönetici':'Kasiyer'}<button onclick="logout()">Çıkış</button></div>`;return h;
}
function openSide(){const s=$('.shell')||$('.drawer');if(s)s.classList.add('open')}
function closeSide(){const s=$('.shell')||$('.drawer');if(s)s.classList.remove('open')}
function nav(pg,opt){if(opt)Object.assign(S,opt);S.page=pg;closeM();render();window.scrollTo(0,0)}
function render(){
 if(!MID)return renderAcct();if(!READY)return showLoading();
 applySet();
 if(!S.user)return renderLogin();
 const allowK=['satis','siparis','gecmis','musteri'];if(!isY()&&!allowK.includes(S.page))S.page='satis';
 if(S.page==='satis')return renderSatis();
 $('#app').innerHTML=`<div class="shell"><div class="scrim" onclick="closeSide()"></div><nav class="side" aria-label="Menü">${sideHTML()}</nav><div style="display:flex;flex-direction:column;min-width:0;min-height:0"><div class="top mtop"><button class="tb" onclick="openSide()" aria-label="Menüyü aç">${ic('menu')}Menü</button><div class="brand">${esc(D.set.market)}</div><button class="tb sp" onclick="nav('satis')">${ic('satis',18)}Satış</button></div><main class="main" id="main"></main></div></div>`;
 ({siparis:pgSiparis,rapor:pgRapor,zrap:pgZ,urun:pgUrun,etiket:pgEtiket,stok:pgStok,alis:pgAlis,gecmis:pgGecmis,musteri:pgMusteri,gider:pgGider,personel:pgPersonel,ayar:pgAyar,tedarik:pgSoon,kasa:pgSoon})[S.page]();
}
const head=(t,a='')=>`<div class="row" style="gap:12px"><h1>${t}</h1><div class="row sp">${a}</div></div>`;

/* ---------- satış ---------- */
function newCart(items){S.carts.push({id:nid(),items:items||[],cust:null,disc:0,ret:false,rec:''});S.ci=S.carts.length-1;S.sel=-1}
const C=()=>S.carts[S.ci];
function cartTot(c){const sub=c.items.reduce((a,l)=>a+lineT(l),0);const lineD=c.items.reduce((a,l)=>a+l.qty*l.price*(l.disc||0)/100,0);return {gross:sub+lineD,lineD,sub,total:Math.max(0,sub-c.disc)}}
function renderSatis(){
 const yeni=D.orders.filter(o=>o.st==='Yeni').length;
 const cats=['Tümü',...D.cats.filter(c=>D.products.some(p=>p.quick&&p.cat===c))];
 $('#app').innerHTML=`<div class="drawer"><div class="scrim" onclick="closeSide()"></div><nav class="side" aria-label="Menü">${sideHTML()}</nav></div>
 <header class="top"><button class="tb" onclick="openSide()" aria-label="Menüyü aç">${ic('menu')}Menü</button><div class="brand">${esc(D.set.market)}</div>
 <div class="scan">${ic('satis',22)}<input id="scan" placeholder="Barkod okut veya ürün ara…" autocomplete="off" enterkeyhint="go" oninput="sugg()" onkeydown="scanKey(event)"><button class="ib ghost" aria-label="Kamerayla okut" onclick="camScan()" style="color:var(--tx3)">${ic('cam')}</button><span class="kbd">F2</span><div id="sg" class="sugg"></div></div>
 <button class="ordb" onclick="nav('siparis')">${ic('siparis',18)}Siparişler ${yeni?`<b>${yeni}</b>`:''}</button>
 <div class="who">${esc(S.user.isim||S.user.name)}<br><small id="clk"></small></div></header>
 <div class="pos" id="pos"><section class="card cart" id="cartBox"></section>
 <section class="card quick"><div class="row"><h2>Hızlı ürünler</h2>${isY()?`<a href="#" class="sp" style="font-size:.82rem;font-weight:700;color:var(--acc)" onclick="event.preventDefault();nav('urun',{uTab:'urun',uf:'Hızlı'})">Düzenle</a>`:''}</div>
 <div class="row" style="gap:6px">${cats.map(c=>`<button class="chip ${S.qcat===c?'on':''}" onclick="S.qcat='${esc(c)}';renderSatis()">${esc(c)}</button>`).join('')}</div>
 <div class="qgrid">${D.products.filter(p=>p.quick&&(S.qcat==='Tümü'||p.cat===S.qcat)).map(p=>`<button class="qp" onclick="addP(${p.id})"><b>${esc(p.name)}</b><span>${tl(p.price)}${p.unit==='kg'?'/kg':''}</span></button>`).join('')||'<div class="muted">Bu kategoride hızlı ürün yok.</div>'}</div></section>
 <section class="pay" id="payBox"></section></div>
 <footer class="keys"><span><b>F1</b> Yardım</span><span><b>F2</b> Barkod</span><span><b>F3</b> Fiyat gör</span><span><b>F4</b> İade</span><span><b>F5</b> İndirim</span><span><b>F6</b> Beklet</span><span><b>F7</b> Müşteri</span><span><b>F8–F11</b> Ödeme</span><span><b>F12</b> Parçalı</span><span><b>3*</b> Adet çarp</span><span><b>Del</b> Satır sil</span><span><b>Esc</b> Sepeti temizle</span><span class="sp" id="fcount"></span></footer>
 <div class="mbar" id="mbar"></div>`;
 drawCart();tick();focusScan();
}
function tick(){const c=$('#clk');if(c)c.textContent='Kasa 1 · '+new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});const f=$('#fcount');if(f){const t=dayKey(new Date());f.textContent='Bugün: '+D.sales.filter(s=>!s.ret&&dayKey(s.date)===t).length+' fiş'}}
setInterval(tick,30000);
function drawCart(){
 const c=C(),t=cartTot(c);$('#pos').classList.toggle('ret',c.ret);
 const cu=c.cust?D.customers.find(x=>x.id===c.cust):null;
 $('#cartBox').innerHTML=`<div class="ctabs">${S.carts.map((x,i)=>`<button class="${i===S.ci?'on':''}" onclick="S.ci=${i};S.sel=-1;drawCart()">Satış ${i+1}${x.items.length&&i!==S.ci?' · bekliyor':''}</button>`).join('')}<button aria-label="Yeni satış sekmesi" onclick="hold()">+</button>${S.carts.length>1?`<button aria-label="Bu sekmeyi kapat" onclick="closeCart()">${ic('x',16)}</button>`:''}</div>
 ${c.ret?`<div class="rethead">İADE MODU · okutulan ürünler iade alınır <button class="btn sm sp" style="min-height:32px;background:#fff;color:#A61E1E;border:0" onclick="toggleRet()">İadeyi kapat</button></div>`:''}
 <div class="lh"><span>ÜRÜN</span><span style="text-align:center">ADET</span><span class="r">BİRİM</span><span class="r">TUTAR</span><span></span></div>
 <div class="lines">${c.items.length?c.items.map((l,i)=>`<div class="ln ${i===S.sel?'sel':''}" onclick="S.sel=${i};drawCart()"><div class="c1"><div class="nm">${esc(l.name)}${l.disc?` <span class="tag t-Nakit">%${l.disc} ind.</span>`:''}</div><div class="bc2 mono">${esc(l.bc||'')}</div></div>
 <div class="qty c2" onclick="event.stopPropagation()">${l.unit==='kg'?`<button aria-label="Miktarı değiştir" style="width:auto;padding:0 10px;font-size:.9rem;font-weight:800" onclick="askKg(${l.pid},${i})">${qf(l.qty,'kg')}</button>`:`<button aria-label="Azalt" onclick="chq(${i},-1)">−</button><span>${l.qty}</span><button aria-label="Artır" onclick="chq(${i},1)">+</button>`}</div>
 <span class="r c3">${tl(l.price)}</span><b class="r c4">${tl(lineT(l))}</b><button class="ib ghost c5" aria-label="Satırı sil" onclick="event.stopPropagation();delLine(${i})">${ic('trash',18)}</button></div>`).join(''):`<div class="empty">Sepet boş. Barkod okut, ürün ara ya da hızlı ürünlerden seç.</div>`}</div>
 <div class="cfoot">${ic('user',18)}<span style="font-size:.88rem">Müşteri: <b>${cu?esc(cu.name):'Seçilmedi'}</b>${cu?` <span class="muted">· borç ${tl(bal(cu))}</span>`:''}</span><button class="btn sm sp" onclick="pickCust()">${cu?'Değiştir':'Müşteri seç'} <span class="kbd">F7</span></button><span class="muted">${c.items.length} kalem</span></div>`;
 const ch=num(c.rec)-t.total;
 $('#payBox').innerHTML=`<div class="tot"><div class="l"><span>Ara toplam</span><span>${tl(t.gross)}</span></div>${t.lineD+c.disc>0?`<div class="l" style="color:#9BE3B9"><span>İndirim</span><span>−${tl(t.lineD+c.disc)}</span></div>`:''}<div class="big"><span style="font-weight:700">${c.ret?'İADE TUTARI':'TOPLAM'}</span><b>${tl(t.total)}</b></div></div>
 <div class="card" style="padding:12px"><div class="g2" style="gap:10px"><label class="f">Alınan<input class="in" id="rec" inputmode="decimal" value="${esc(c.rec)}" placeholder="${tl(t.total)}" oninput="C().rec=this.value;upCh()" onkeydown="if(event.key==='Enter')pay('Nakit')"></label><div class="f" style="font-size:.82rem;font-weight:600;color:var(--tx2)">Para üstü<div id="chg" style="min-height:46px;display:flex;align-items:center;padding:0 12px;border-radius:10px;background:var(--okSoft);color:var(--okTx);font-weight:800;font-size:1.1rem">${tl(Math.max(0,ch))}</div></div></div>
 <div class="row" style="gap:6px">${[50,100,200,500,1000].map(v=>`<button class="chip" onclick="C().rec='${v}';drawCart()">₺${v}</button>`).join('')}</div></div>
 <div class="paygrid"><button class="pb" style="background:var(--ok)" onclick="pay('Nakit')">Nakit<small>F8</small></button><button class="pb" style="background:var(--acc)" onclick="pay('Kart')">Kart<small>F9</small></button><button class="pb" style="background:var(--vio)" onclick="pay('Havale')">Havale<small>F10</small></button><button class="pb" style="background:var(--warn)" onclick="pay('Veresiye')">Veresiye<small>F11</small></button>
 <button class="btn" style="grid-column:span 2;font-size:.95rem" onclick="split()">Parçalı ödeme (nakit + kart) <span class="kbd">F12</span></button></div>
 <div class="aux"><button class="rb ${c.ret?'on':''}" onclick="toggleRet()">İade<small>F4</small></button><button onclick="discount()">İndirim<small>F5</small></button><button onclick="hold()">Beklet<small>F6</small></button></div>`;
 $('#mbar').innerHTML=`<div><div style="font-size:.75rem;color:#C9D3E3">${c.ret?'İade':'Toplam'} · ${c.items.length} kalem</div><b>${tl(t.total)}</b></div><button class="btn okb sp" style="min-height:50px" onclick="document.getElementById('payBox').scrollIntoView({behavior:'smooth'})">Ödemeye geç</button>`;
}
function upCh(){const t=cartTot(C());$('#chg').textContent=tl(Math.max(0,num(C().rec)-t.total))}
function addP(id,q){
 const p=P(id);if(!p)return;
 if(p.unit==='kg'&&q==null)return askKg(id);
 q=q||1;const c=C();
 if(!c.ret&&!D.set.neg){const inCart=c.items.filter(l=>l.pid===id).reduce((a,l)=>a+l.qty,0);if(p.stock-inCart<q){toast(p.name+': stok yetersiz ('+qf(p.stock,p.unit)+')');beep(false);return}}
 const ex=p.unit!=='kg'&&c.items.findIndex(l=>l.pid===id);
 if(ex!==false&&ex>-1){c.items[ex].qty+=q;S.sel=ex}else{c.items.push(li(p,q,0));S.sel=c.items.length-1}
 beep(true);drawCart();const s=$('#scan');if(s){s.value='';$('#sg').innerHTML=''}focusScan();
}
function askKg(id,idx){const p=P(id);modal(mHead(esc(p.name))+`<p class="muted" style="margin:0">${tl(p.price)} / kg</p><label class="f">Miktar (kg)<input class="in" id="kg" inputmode="decimal" autofocus value="${idx!=null?String(C().items[idx].qty).replace('.',','):''}" placeholder="örn. 1,250" onkeydown="if(event.key==='Enter')okKg(${id},${idx??-1})"></label><div class="row" style="gap:6px">${[0.25,0.5,1,1.5,2].map(v=>`<button class="chip" onclick="$('#kg').value='${String(v).replace('.',',')}'">${String(v).replace('.',',')} kg</button>`).join('')}</div><button class="btn pri" onclick="okKg(${id},${idx??-1})">Tamam</button>`)}
function okKg(id,idx){const q=num2($('#kg').value);if(q<=0){toast('Geçerli bir miktar gir');return}closeM();if(idx>-1){C().items[idx].qty=q;drawCart()}else addP(id,q)}
function chq(i,d){const l=C().items[i];l.qty+=d;if(l.qty<=0)C().items.splice(i,1);S.sel=Math.min(i,C().items.length-1);drawCart()}
function delLine(i){const c=C();if(i==null)i=S.sel>-1?S.sel:c.items.length-1;if(i<0||!c.items[i])return;c.items.splice(i,1);S.sel=Math.min(i,c.items.length-1);drawCart();focusScan()}
function findCode(v){return D.products.find(p=>p.barcode===v)}
function matches(v){v=v.toLocaleLowerCase('tr');return D.products.filter(p=>p.name.toLocaleLowerCase('tr').includes(v)||p.barcode.includes(v)).slice(0,7)}
function parseScan(raw){const m=raw.match(/^(\d+(?:[.,]\d+)?)\*(.*)$/);return m?{q:num2(m[1]),v:m[2].trim()}:{q:null,v:raw.trim()}}
function sugg(){const {v}=parseScan($('#scan').value);const g=$('#sg');if(v.length<2||/^\d{8,}$/.test(v)){g.innerHTML='';return}const r=matches(v);g.innerHTML=r.map(p=>`<button onclick="pickSug(${p.id})"><span><b>${esc(p.name)}</b> <span class="muted mono">${p.barcode}</span></span><b>${tl(p.price)}</b></button>`).join('')}
function pickSug(id){const {q}=parseScan($('#scan').value);addP(id,q??undefined)}
function scanKey(e){
 if(e.key!=='Enter')return;e.preventDefault();const raw=$('#scan').value;const {q,v}=parseScan(raw);if(!v)return;
 let p=findCode(v);if(!p){const r=matches(v);if(r.length)p=r[0]}
 if(p)return addP(p.id,q??undefined);
 beep(false);$('#sg').innerHTML='';
 if(isY())modal(mHead('Ürün bulunamadı')+`<p style="margin:0"><b class="mono">${esc(v)}</b> kayıtlı değil.</p><div class="row"><button class="btn" onclick="closeM()">Vazgeç</button><button class="btn pri sp" onclick="prodForm(null,'${esc(v)}')">Yeni ürün olarak ekle</button></div>`);
 else toast('Ürün bulunamadı: '+v);
}
function camScan(){
 if(!('BarcodeDetector' in window)){modal(mHead('Kamerayla okutma')+`<p style="margin:0;line-height:1.6">Bu tarayıcı kamerayla barkod okumayı desteklemiyor. Android'de Chrome ile açarsan çalışır; iPhone/iPad desteği yazılım aşamasında eklenecek. Şimdilik barkodu elle yazabilir ya da adıyla arayabilirsin.</p><button class="btn pri" onclick="closeM()">Tamam</button>`);return}
 modal(mHead('Barkodu kameraya göster')+`<video id="cv" playsinline muted style="width:100%;border-radius:12px;background:#000"></video><button class="btn" onclick="stopCam();closeM()">Kapat</button>`);
 const det=new BarcodeDetector({formats:['ean_13','ean_8','code_128','upc_a','upc_e']});
 navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(st=>{window._cs=st;const v=$('#cv');v.srcObject=st;v.play();
  const loop=async()=>{if(!$('#cv'))return stopCam();try{const r=await det.detect(v);if(r.length){stopCam();closeM();const code=r[0].rawValue;const p=findCode(code);if(p)addP(p.id);else{$('#scan').value=code;scanKey({key:'Enter',preventDefault(){}})}return}}catch(e){}requestAnimationFrame(loop)};loop();
 }).catch(()=>{closeM();toast('Kameraya izin verilmedi')});
}
function stopCam(){if(window._cs){window._cs.getTracks().forEach(t=>t.stop());window._cs=null}}
function hold(){newCart();drawCart();toast('Yeni satış sekmesi açıldı');focusScan()}
function closeCart(){const go=()=>{S.carts.splice(S.ci,1);if(!S.carts.length)newCart();S.ci=Math.max(0,Math.min(S.ci,S.carts.length-1));drawCart()};if(C().items.length)ask('Bu sekmedeki ürünler silinsin mi?',go);else go()}
function clearCart(){const c=C();if(!c.items.length)return;c.items=[];c.disc=0;c.rec='';c.cust=null;S.sel=-1;drawCart();toast('Sepet temizlendi')}
function toggleRet(){C().ret=!C().ret;drawCart();toast(C().ret?'İade modu açık':'İade modu kapandı')}
function discount(){
 if(!C().items.length){toast('Önce ürün ekle');return}
 const go=()=>modal(mHead('İndirim')+`<label class="f">İndirim (tutar veya yüzde)<input class="in" id="dv" autofocus placeholder="örn. 20 veya %10" onkeydown="if(event.key==='Enter')okDisc()"></label><div class="row" style="gap:6px">${['%5','%10','%15','₺10','₺20'].map(v=>`<button class="chip" onclick="$('#dv').value='${v}'">${v}</button>`).join('')}</div>
 <div class="seg" style="display:grid;grid-template-columns:1fr 1fr"><button class="on" id="dAll" onclick="this.classList.add('on');$('#dLine').classList.remove('on')">Tüm sepete</button><button id="dLine" onclick="this.classList.add('on');$('#dAll').classList.remove('on')" ${S.sel<0?'disabled':''}>Seçili satıra</button></div><button class="btn pri" onclick="okDisc()">Uygula</button>`);
 if(!isY()&&!D.set.cashDisc)askPw('Kasiyerin indirim yapması için yönetici onayı gerekiyor.',go);else go();
}
function okDisc(){const v=$('#dv').value.trim();const c=C();const pct=v.includes('%');const n=num2(v.replace(/[%₺]/g,''));if(n<0){return}
 if($('#dLine').classList.contains('on')&&S.sel>-1){const l=c.items[S.sel];l.disc=pct?Math.min(100,n):Math.min(100,n/(l.qty*l.price)*100)}
 else{const t=cartTot(c);c.disc=pct?t.sub*n/100:Math.min(n,t.sub)}
 closeM();drawCart()}
function pickCust(){modal(mHead('Müşteri seç')+`<input class="in" id="cq" autofocus placeholder="Ad veya telefon ara" oninput="custList()"><div id="cl" style="display:flex;flex-direction:column;gap:6px"></div><div class="row"><button class="btn" onclick="C().cust=null;closeM();drawCart()">Müşteriyi kaldır</button><button class="btn pri sp" onclick="custForm(true)">+ Yeni müşteri</button></div>`);custList()}
function custList(){const q=($('#cq').value||'').toLocaleLowerCase('tr');$('#cl').innerHTML=D.customers.filter(c=>c.name.toLocaleLowerCase('tr').includes(q)||c.phone.includes(q)).map(c=>`<button class="user" onclick="C().cust=${c.id};closeM();drawCart()"><span class="av">${ini(c.name)}</span><span style="flex:1">${esc(c.name)}<br><span class="muted">${esc(c.phone)}</span></span><b style="color:${bal(c)>0?'var(--badTx)':'inherit'}">${tl(bal(c))}</b></button>`).join('')||'<div class="muted">Müşteri bulunamadı.</div>'}
function pay(type,parts,force){
 const c=C(),t=cartTot(c);if(!c.items.length){toast('Sepet boş');beep(false);return}
 if(type==='Veresiye'){if(!c.cust){toast('Veresiye için önce müşteri seç (F7)');pickCust();return}const cu=D.customers.find(x=>x.id===c.cust);if(!force&&!c.ret&&cu.limit&&bal(cu)+t.total>cu.limit){ask(cu.name+' için veresiye limiti aşılıyor ('+tl(cu.limit)+'). Yine de devam edilsin mi?',()=>pay(type,parts,true));return}}
 if(type==='Nakit'&&!c.ret&&c.rec&&num(c.rec)<t.total){toast('Alınan tutar toplamdan az');beep(false);return}
 const s=mkSale(D,c.items,c.disc,type,c.cust,c.ret,S.user.id,false,parts);
 D.sales.push(s);
 for(const l of c.items){const p=P(l.pid);if(p)p.stock=Math.round((p.stock+(c.ret?l.qty:-l.qty))*1000)/1000}
 if(type==='Veresiye'){const cu=D.customers.find(x=>x.id===c.cust);cu.moves.push({date:s.date,t:c.ret?'Veresiye iade':'Veresiye satış',a:s.total})}
 const rec=num(c.rec);save();
 S.carts.splice(S.ci,1);if(!S.carts.length)newCart();else S.ci=Math.min(S.ci,S.carts.length-1);S.sel=-1;
 drawCart();tick();beep(true);
 if(D.set.autoRc)showRc(s,type==='Nakit'&&rec>t.total?rec-t.total:0);else toast((c.ret?'İade tamamlandı: ':'Satış tamamlandı: ')+tl(Math.abs(s.total)));
}

function inPer(d,per){const t=new Date(d),n=new Date();const s=new Date(n);s.setHours(0,0,0,0);
 if(per==='bugun')return t>=s;if(per==='hafta'){s.setDate(s.getDate()-6);return t>=s}if(per==='ay'){return t.getMonth()===n.getMonth()&&t.getFullYear()===n.getFullYear()}if(per==='yil')return t.getFullYear()===n.getFullYear();return true}

 const gider=D.expenses.filter(e=>inPer(e.date,per)).reduce((a,e)=>a+e.amount,0);
 const fis=ss.filter(s=>!s.ret).length;return {ss,ciro,cost,brut:ciro-cost,gider,net:ciro-cost-gider,fis,ort:fis?ciro/fis:0,iade:ss.filter(s=>s.ret).reduce((a,s)=>a-s.total,0)}}

 const rows=Object.entries(grp).sort((a,b)=>b[1].c-a[1].c);
 const kpi=(l,v,c)=>`<div class="kpi"><span>${l}</span><b style="${c?'color:'+c:''}">${v}</b></div>`;
 $('#main').innerHTML=head('Raporlar',seg([['bugun','Bugün'],['hafta','Son 7 gün'],['ay','Bu ay'],['yil','Bu yıl'],['tum','Tümü']],S.rPer,'setPer')+`<button class="btn" onclick="toast('Excel çıktısı yazılım aşamasında eklenecek')">Excel'e aktar</button>`)
 +`<div class="kpis">${kpi('Ciro',tl(st.ciro))}${kpi('Brüt kâr',tl(st.brut),'var(--okTx)')}${kpi('Giderler',tl(st.gider),'var(--badTx)')}${kpi('Net kâr',tl(st.net),st.net<0?'var(--badTx)':'var(--okTx)')}${kpi('Fiş sayısı',st.fis)}${kpi('Ortalama sepet',tl(st.ort))}</div>
 <div class="g2" style="grid-template-columns:1.5fr 1fr"><div class="card"><div class="row"><h2>Günlük ciro (son 7 gün)</h2></div><div class="bars">${days.map(d=>`<div class="${d[2]?'today':''}" title="${tl(d[1])}"><span style="font-size:.68rem">${d[1]>=1000?(d[1]/1000).toFixed(1).replace('.',',')+'b':Math.round(d[1])}</span><i style="height:${Math.max(1,d[1]/mx*85)}%"></i>${d[0]}</div>`).join('')}</div></div>

const EL=['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'],EG=['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'],ER=EL.map(s=>[...s].map(c=>c==='0'?'1':'0').join('')),EP=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
function ean(c){if(!/^\d{13}$/.test(c))return `<div class="mono bcn">${esc(c)}</div>`;const d=[...c].map(Number);let b='101';for(let i=1;i<7;i++)b+=(EP[d[0]][i-1]==='L'?EL:EG)[d[i]];b+='01010';for(let i=7;i<13;i++)b+=ER[d[i]];b+='101';let r='';[...b].forEach((x,i)=>{if(x==='1')r+=`<rect x="${i}" y="0" width="1" height="40"/>`});return `<svg class="bc" viewBox="0 0 ${b.length} 40" preserveAspectRatio="none" aria-label="Barkod ${c}">${r}</svg><div class="mono bcn">${c}</div>`}

 <h2 style="margin-top:8px">Görünüm</h2><div class="f" style="font-size:.82rem;font-weight:600;color:var(--tx2)">Tema${seg([['light','Açık'],['dark','Koyu'],['auto','Cihaza göre']],s.theme,'setTheme')}</div>

 <div class="card"><h2>Satış ekranı</h2><div class="f" style="font-size:.82rem;font-weight:600;color:var(--tx2)">Hızlı ürün sütun sayısı${seg([['2','2'],['3','3'],['4','4'],['5','5']],String(s.cols),'setCols')}</div>
 ${tg('autoRc','Satıştan sonra fişi göster','Kapalıysa sadece kısa bildirim çıkar')}${tg('sound','Sesli uyarılar','Barkod okununca ve hata olunca ses')}${tg('neg','Stokta olmayan ürünü satmaya izin ver')}${tg('cashDisc','Kasiyer indirim yapabilsin','Kapalıysa yönetici şifresi istenir')}</div>
 <div class="card"><h2>Yedekleme ve veri</h2><p class="muted" style="margin:0">Veriler bulutta, tüm cihazlarda ortak. İnternet kesilirse satış devam eder, bağlantı gelince eşitlenir.</p><p style="margin:0;font-size:.9rem">Market hesabı: <b>${esc(S.email||"")}</b></p><div class="row"><button class="btn" onclick="clrDemo()">Örnek ürünleri sil</button><button class="btn" onclick="acctOut()">Bu cihazı hesaptan çıkar</button><button class="btn danger" onclick="resetAll()">Her şeyi sıfırla</button></div></div>

function setTheme(v){D.set.theme=v;save();render()}function setFs(v){D.set.fs=+v;save();render()}function setCols(v){D.set.cols=+v;save();render()}
function clrDemo(){ask('Başlangıçta eklenen örnek ürünler silinsin mi?',clrDemo2)}function clrDemo2(){D.products=D.products.filter(p=>!p.demo);D.sales=D.sales.filter(s=>!s.demo);D.expenses=D.expenses.filter(e=>!e.demo);D.customers.forEach(c=>c.moves=c.moves.filter(m=>!m.demo));save();render();toast('Örnek veriler silindi')}

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';

const app=initializeApp({apiKey:"AIzaSyACrApSGsB84Y5bLjsjFc39vjLq0WYDq-U",authDomain:"barkod-sistemi-v1.firebaseapp.com",projectId:"barkod-sistemi-v1",storageBucket:"barkod-sistemi-v1.firebasestorage.app",messagingSenderId:"628617167908",appId:"1:628617167908:web:9a1a53a471a958d79b84b1"});
const auth=getAuth(app);
let db;try{db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()}),ignoreUndefinedProperties:true})}catch(e){db=initializeFirestore(app,{ignoreUndefinedProperties:true})}
const COLS=['products','customers','users','sales','expenses','purchases','orders'];let uns=[];
window.FB={login:(e,p)=>signInWithEmailAndPassword(auth,e,p),signup:(e,p)=>createUserWithEmailAndPassword(auth,e,p),logout:()=>signOut(auth),reset:e=>sendPasswordResetEmail(auth,e),
 async write(mid,ops){for(let i=0;i<ops.length;i+=400){const b=writeBatch(db);for(const [t,c,id,data] of ops.slice(i,i+400)){const r=doc(db,'markets',mid,c,id);if(t==='set')b.set(r,data);else b.delete(r)}await b.commit()}}};
onAuthStateChanged(auth,u=>{uns.forEach(f=>f());uns=[];if(!u){window.cloudOut();return}window.cloudIn(u);
 for(const c of COLS)uns.push(onSnapshot(collection(db,'markets',u.uid,c),s=>window.onCol(c,s.docs.map(d=>d.data()),s.metadata.hasPendingWrites,s.metadata.fromCache),e=>window.onErr(e)));
 uns.push(onSnapshot(doc(db,'markets',u.uid,'meta','main'),{includeMetadataChanges:true},s=>window.onMeta(s.exists()?s.data():null,s.metadata.hasPendingWrites,s.metadata.fromCache),e=>window.onErr(e)));
});
