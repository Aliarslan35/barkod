<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barkod Sistemi</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F1A2E">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Barkod">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{--bg:#EEF1F5;--surf:#FFFFFF;--surf2:#F7F8FA;--line:#E2E6EC;--line2:#CBD2DC;--tx:#14181F;--tx2:#3A4556;--tx3:#5A6578;--panel:#0F1A2E;--acc:#1F5FD6;--ok:#157347;--okTx:#136334;--okSoft:#E7F6EE;--bad:#C92A2A;--badTx:#A61E1E;--badSoft:#FDE8E8;--warn:#B8440A;--warnTx:#8A3A08;--warnSoft:#FDEDE3;--vio:#5B3FC4;--org:#E8590C;--fs:16px;--c-nakit:#157347;--c-kart:var(--acc);--c-havale:#5B3FC4;--c-veresiye:#B8440A;--c-iade:#C92A2A;--c-siparis:#E8590C;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1219;--surf:#161D29;--surf2:#1C2533;--line:#263042;--line2:#36445C;--tx:#E8ECF2;--tx2:#C3CCD9;--tx3:#98A5B8;--panel:#090E16;--okTx:#78D9A3;--okSoft:#12301F;--badTx:#FF9B9B;--badSoft:#3A1A1C;--warnTx:#FFB27D;--warnSoft:#3A2414;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1219;--surf:#161D29;--surf2:#1C2533;--line:#263042;--line2:#36445C;--tx:#E8ECF2;--tx2:#C3CCD9;--tx3:#98A5B8;--panel:#090E16;--okTx:#78D9A3;--okSoft:#12301F;--badTx:#FF9B9B;--badSoft:#3A1A1C;--warnTx:#FFB27D;--warnSoft:#3A2414;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);font-size:var(--fs)}
html,body{height:100%;margin:0}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:var(--font,'Plus Jakarta Sans'),'Segoe UI',system-ui,sans-serif;font-size:1rem;-webkit-tap-highlight-color:transparent}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
#app{height:100%;display:flex;flex-direction:column}
.soft{background:color-mix(in srgb,var(--acc) 12%,var(--surf))}
/* buttons */
.btn{min-height:44px;padding:0 16px;border:1.5px solid var(--line2);border-radius:10px;background:var(--surf);font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.btn.okb{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
.btn.danger{border-color:var(--bad);color:var(--badTx);font-weight:700}
.btn.sm{min-height:36px;padding:0 12px;font-size:.82rem}
.ib{width:40px;height:40px;border:1px solid var(--line2);border-radius:9px;background:var(--surf);display:inline-flex;align-items:center;justify-content:center;font-size:1.1rem;padding:0}
.ib.ghost{border:0;background:transparent;color:var(--tx3)}
input.in,select.in{width:100%;min-height:46px;padding:0 12px;border:1.5px solid var(--line2);border-radius:10px;background:var(--surf);font-size:1rem}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.82rem;font-weight:600;color:var(--tx2)}
.seg{display:inline-flex;gap:4px;padding:4px;background:color-mix(in srgb,var(--tx) 8%,var(--surf));border-radius:10px;flex-wrap:wrap}
.seg button{min-height:36px;padding:0 12px;border:0;border-radius:8px;background:transparent;font-size:.82rem;font-weight:600;color:var(--tx2)}
.seg button.on{background:var(--surf);color:var(--tx);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.chip{display:inline-flex;align-items:center;min-height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:var(--surf2);font-size:.82rem;font-weight:600;color:var(--tx2)}
.chip.on{background:color-mix(in srgb,var(--acc) 14%,var(--surf));border-color:color-mix(in srgb,var(--acc) 40%,var(--surf));color:var(--tx)}
.tag{font-size:.75rem;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
.t-Nakit{background:var(--okSoft);color:var(--okTx)}.t-Kart{background:color-mix(in srgb,var(--acc) 14%,var(--surf));color:var(--tx)}.t-Havale{background:color-mix(in srgb,var(--vio) 16%,var(--surf));color:var(--tx)}.t-Veresiye{background:var(--warnSoft);color:var(--warnTx)}.t-Parçalı{background:var(--surf2);color:var(--tx2)}.t-iade{background:var(--badSoft);color:var(--badTx)}
.card{background:var(--surf);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
h1{margin:0;font-size:1.6rem;font-weight:800;letter-spacing:-.4px}
h2{margin:0;font-size:1rem;font-weight:800}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{margin-left:auto}
.muted{color:var(--tx3);font-size:.85rem}
.kbd{font-family:'JetBrains Mono',monospace;font-size:.7rem;font-weight:700;padding:2px 6px;border:1px solid var(--line2);border-radius:5px;color:var(--tx3)}
/* login */
.login{min-height:100%;display:grid;grid-template-columns:1fr 1fr}
.login .lp{background:var(--panel);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.login .lp h1{font-size:2.4rem;line-height:1.15;color:#fff}
.login .lf{display:flex;align-items:center;justify-content:center;padding:32px 20px}
.login .box{width:100%;max-width:440px;display:flex;flex-direction:column;gap:18px}
.logo{display:flex;align-items:center;gap:12px;font-weight:800;font-size:1.2rem}
.logo i{width:44px;height:44px;border-radius:11px;background:var(--acc);display:flex;align-items:center;justify-content:center}
.users{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.user{min-height:56px;border:1.5px solid var(--line2);border-radius:12px;background:var(--surf);display:flex;align-items:center;gap:10px;padding:0 12px;font-weight:600;text-align:left}
.user.on{border:2px solid var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--surf));font-weight:700}
.av{width:34px;height:34px;border-radius:50%;background:color-mix(in srgb,var(--tx) 10%,var(--surf));display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:800;flex:none}
.user.on .av{background:var(--acc);color:#fff}
.err{color:var(--badTx);font-weight:700;font-size:.9rem}
@media (max-width:820px){.login{grid-template-columns:1fr}.login .lp{padding:28px 22px;border-radius:0 0 24px 24px}.login .lp h1{font-size:1.6rem}.login .lp .big{display:none}}
/* top bar */
.top{background:var(--panel);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 14px;flex:none}
.top .tb{min-height:44px;padding:0 14px;border:0;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;font-weight:700;display:flex;align-items:center;gap:8px}
.top .brand{font-weight:800;white-space:nowrap}
.scan{flex:1;position:relative;display:flex;align-items:center;gap:10px;min-height:46px;padding:0 12px;background:var(--surf);color:var(--tx3);border-radius:10px;min-width:0}
.scan input{flex:1;border:0;outline:0;background:transparent;color:var(--tx);font-size:1rem;min-width:0;height:44px}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surf);color:var(--tx);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:30;overflow:hidden}
.sugg button{display:flex;width:100%;justify-content:space-between;gap:10px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left}
.sugg button:hover{background:var(--surf2)}
.ordb{min-height:44px;padding:0 14px;border:0;border-radius:10px;background:var(--c-siparis);color:#fff;font-weight:700;display:flex;align-items:center;gap:8px;white-space:nowrap}
.ordb b{background:#fff;color:#A53F08;border-radius:10px;padding:0 8px;font-size:.8rem}
.who{text-align:right;line-height:1.25;white-space:nowrap;font-size:.85rem;font-weight:700}
.who small{color:#C9D3E3;font-weight:500}
/* POS */
.pos{flex:1;min-height:0;display:grid;grid-template-columns:1fr minmax(320px,400px) 330px;grid-template-areas:"cart quick pay";gap:12px;padding:12px}
.cart{grid-area:cart;padding:0;overflow:hidden}
.quick{grid-area:quick;min-height:0}
.pay{grid-area:pay;display:flex;flex-direction:column;gap:12px;min-height:0}
.ctabs{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.ctabs button{min-height:38px;padding:0 14px;border:1px solid var(--line2);border-radius:8px;background:var(--surf);font-weight:600;font-size:.85rem;white-space:nowrap}
.ctabs button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.rethead{background:var(--bad);color:#fff;padding:8px 14px;font-weight:800;display:flex;align-items:center;gap:10px;flex:none}
.lh,.ln{display:grid;grid-template-columns:1fr 132px 84px 96px 40px;gap:8px;align-items:center;padding:9px 14px}
.lh{font-size:.72rem;font-weight:700;color:var(--tx3);background:var(--surf2);flex:none}
.lines{flex:1;overflow-y:auto;min-height:0}
.ln{border-bottom:1px solid var(--line);cursor:pointer}
.ln.sel{background:color-mix(in srgb,var(--acc) 10%,var(--surf))}
.ln .nm{font-weight:700;font-size:.95rem}
.ln .bc2{font-size:.72rem;color:var(--tx3)}
.qty{display:flex;align-items:center;justify-content:center;gap:4px}
.qty button{width:36px;height:36px;border:1px solid var(--line2);border-radius:8px;background:var(--surf);font-size:1.1rem;padding:0}
.qty span{min-width:34px;text-align:center;font-weight:800}
.r{text-align:right}
.empty{padding:40px 20px;text-align:center;color:var(--tx3)}
.cfoot{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);background:var(--surf2);flex-wrap:wrap;flex:none}
.qgrid{flex:1;display:grid;grid-template-columns:repeat(var(--cols,3),1fr);grid-auto-rows:minmax(84px,auto);gap:8px;overflow-y:auto;min-height:0;align-content:start}
.qp{border:1px solid var(--line);border-radius:10px;background:var(--surf2);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:10px;text-align:left;min-height:74px}
.qp b{font-size:.88rem}.qp span{color:var(--acc);font-weight:800;font-size:.88rem}
.qp:active{transform:scale(.97)}
.tot{background:var(--panel);color:#fff;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px}
.tot .l{display:flex;justify-content:space-between;font-size:.88rem;color:#C9D3E3}
.tot .big{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px}
.tot .big b{font-size:2.4rem;letter-spacing:-1px}
.ret .tot{background:var(--bad)}
.paygrid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(64px,1fr);gap:10px}.paygrid .btn{min-height:50px}
.pb{border:0;border-radius:12px;color:#fff;font-size:1.2rem;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.pb small{font-family:'JetBrains Mono',monospace;font-size:.7rem;opacity:.85;font-weight:500}
.aux{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.aux button{min-height:54px;border:1.5px solid var(--line2);border-radius:10px;background:var(--surf);font-weight:700;font-size:.85rem;display:flex;flex-direction:column;align-items:center;justify-content:center}
.aux button small{font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--tx3);font-weight:500}
.aux .rb{border-color:var(--c-iade);color:var(--c-iade)}
.aux .rb.on{background:var(--c-iade);color:#fff}.aux .rb.on small{color:#fff}
.keys{background:var(--surf);border-top:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 14px;min-height:42px;font-size:.8rem;color:var(--tx2);white-space:nowrap;overflow-x:auto;flex:none}
.keys b{font-family:'JetBrains Mono',monospace}
.mbar{display:none}
@media (max-width:1250px){.pos{grid-template-columns:1fr 330px;grid-template-areas:"cart pay" "quick pay";grid-template-rows:1.2fr 1fr}}
@media (max-width:820px){
 html,body,#app{height:auto}
 .top{flex-wrap:wrap}.top .scan{order:5;flex-basis:100%}.who{display:none}.top .brand{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}.ordb{padding:0 10px}#toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
 .pos{display:flex;flex-direction:column;padding:10px}
 .cart{order:1;min-height:240px}.quick{order:2}.pay{order:3}
 .qgrid{grid-template-columns:repeat(3,1fr);max-height:340px}
 .lh{display:none}.ln{grid-template-columns:1fr auto auto;grid-template-areas:"nm nm del" "qt pr tt"}
 .ln .c1{grid-area:nm}.ln .c2{grid-area:qt;justify-content:flex-start}.ln .c3{grid-area:pr;color:var(--tx3)}.ln .c4{grid-area:tt}.ln .c5{grid-area:del}
 .lines{max-height:none}
 .keys{display:none}
 .mbar{display:flex;position:sticky;bottom:0;z-index:20;background:var(--panel);color:#fff;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));align-items:center;gap:12px}
 .mbar b{font-size:1.5rem}
}
/* shell */
.shell{flex:1;min-height:0;display:grid;grid-template-columns:96px 1fr}
.side{background:var(--panel);color:#fff;display:flex;flex-direction:column;align-items:center;padding:14px 8px;gap:2px;overflow-y:auto;z-index:50;scrollbar-width:none;box-sizing:border-box}
.side::-webkit-scrollbar{display:none}
.side .rl{width:44px;height:44px;border-radius:12px;overflow:hidden;flex:none;margin-bottom:8px;display:block}
.side a{position:relative;width:80px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:50px;padding:5px 2px;border-radius:14px;color:rgba(255,255,255,.7);text-decoration:none;font-size:.68rem;font-weight:700;line-height:1.15;text-align:center;box-sizing:border-box}
.side a:hover{background:rgba(255,255,255,.07);color:#fff}
.side a.on{background:rgba(255,255,255,.15);color:#fff}
.side a .bdg{position:absolute;top:4px;right:14px;min-width:18px;height:18px;border-radius:9px;background:var(--org);color:#fff;font-size:.65rem;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px;box-sizing:border-box}
.side .lo{margin-top:auto;padding-top:10px;border-top:1px solid rgba(255,255,255,.14);display:flex;flex-direction:column;align-items:center;gap:2px;width:80px;flex:none}
.side .lo .av2{width:36px;height:36px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;margin-bottom:4px}
.side .lo button{width:80px;min-height:46px;border:0;border-radius:14px;background:transparent;color:rgba(255,255,255,.7);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.68rem;font-weight:700;padding:0}
.side .lo button:hover{background:rgba(255,255,255,.07);color:#fff}
.scrim{display:none}
.main{min-width:0;overflow-y:auto;padding:22px 24px;display:flex;flex-direction:column;gap:16px}
.mtop{display:none}
.drawer .side{position:fixed;left:0;top:0;bottom:0;width:96px;transform:translateX(-105%);transition:transform .2s ease;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.drawer.open .side{transform:none}
.drawer.open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:45}
@media (max-width:1100px){
 .shell{grid-template-columns:1fr}
 .shell .side{position:fixed;left:0;top:0;bottom:0;width:96px;transform:translateX(-105%);transition:transform .2s ease;padding-top:calc(14px + env(safe-area-inset-top,0px))}
 .shell.open .side{transform:none}
 .shell.open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:45}
 .mtop{display:flex;position:sticky;top:0;z-index:20}
 .main{padding:16px 14px}
}
@media (max-width:820px){.shell{display:block}.main{overflow:visible}}
@media (pointer:coarse){.kbd{display:none}}
[hidden]{display:none!important}
.pos.noquick{grid-template-columns:1fr 330px;grid-template-areas:"cart pay"}
@media (max-width:1250px){.pos.noquick{grid-template-rows:1fr}}
.editing [data-tk],.editing [data-hk],.editing [data-ck]{outline:2px dashed #F2B705;outline-offset:-2px;cursor:pointer}
[data-hid]{opacity:.35}
#edbar>div{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:90;background:#FFD43B;color:#14181F;border-radius:12px;padding:8px 8px 8px 14px;display:flex;gap:10px;align-items:center;font-weight:700;font-size:.88rem;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:calc(100% - 20px)}
#edbar button{min-height:38px;border:0;border-radius:8px;padding:0 12px;font-weight:800;background:#14181F;color:#fff}
@media (max-width:820px){#edbar>div{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:reduce){.side{transition:none!important}}
/* tables */
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem;min-width:560px}
.tbl th{font-size:.72rem;font-weight:700;color:var(--tx3);text-align:left;padding:10px;background:var(--surf2)}
.tbl td{padding:10px;border-bottom:1px solid var(--line)}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--surf2)}
.tbl .r{text-align:right}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.kpi{background:var(--surf);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi span{font-size:.8rem;font-weight:600;color:var(--tx3)}.kpi b{font-size:1.45rem;letter-spacing:-.4px}
.bars{display:flex;align-items:flex-end;gap:12px;height:200px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:.72rem;color:var(--tx3);font-weight:600}
.bars i{display:block;width:100%;background:color-mix(in srgb,var(--acc) 35%,var(--surf));border-radius:6px 6px 2px 2px;min-height:2px}
.bars div.today i{background:var(--acc)}
.shr{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:600}
.shr .bar{height:10px;background:var(--surf2);border-radius:5px;overflow:hidden}.shr .bar i{display:block;height:100%;border-radius:5px}
@media (max-width:1250px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media (max-width:820px){.kpis{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}h1{font-size:1.35rem}}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-weight:600;font-size:.92rem;cursor:pointer}
.tgl small{display:block;color:var(--tx3);font-weight:500;font-size:.78rem}
.sw{width:48px;height:28px;border-radius:14px;background:var(--line2);padding:3px;display:flex;flex:none;transition:background .15s}
.sw i{width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.sw.on{background:var(--acc)}.sw.on i{transform:translateX(20px)}
.swatch{width:42px;height:42px;border-radius:50%;border:3px solid transparent}
.swatch.on{border-color:var(--tx)}
.ord{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--surf)}
/* modal & toast */
.ov{position:fixed;inset:0;background:rgba(5,10,20,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.mb{background:var(--surf);border-radius:16px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.35)}

function li(p,q,disc){return {pid:p.id,name:p.name,unit:p.unit,qty:q,price:p.price,cost:p.cost,cat:p.cat,brand:p.brand,tags:[...(p.tags||[])],disc:disc||0,bc:p.barcode}}

function mkSale(d,items,disc,pay,cust,ret,uid,demo,parts){
 const sub=items.reduce((a,l)=>a+lineT(l),0);let total=Math.max(0,sub-disc);if(ret)total=-total;
 const u=d.users.find(x=>x.id===uid);
 return {id:nid(),no:nextFis(d),date:new Date().toISOString(),user:u?u.name:'',items:items.map(l=>({...l})),sub,disc,total,pay,parts:parts||null,cust,ret,demo:!!demo};
}

function loadFont(n){const id='fnt-'+n.replace(/\W/g,'');if(document.getElementById(id))return;const l=document.createElement('link');l.id=id;l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family='+n.replace(/ /g,'+')+':wght@400;500;600;700;800&display=swap';document.head.appendChild(l)}

function ordSort(keys,ord){ord=ord||[];return [...keys].sort((a,b)=>{const i=ord.indexOf(a),j=ord.indexOf(b);return (i<0?99+keys.indexOf(a):i)-(j<0?99+keys.indexOf(b):j)})}

function setColRaw(k,v){if(k==='acc'){D.set.acc=v||'#1F5FD6';return}const u=UI();if(v)u.col[k]=v;else delete u.col[k]}
function setCol(k,v){setColRaw(k,v);save();render()}
function setFont(v){UI().font=v;save();render()}

function editMode(on){if(on&&!isY())return;S.edit=on;if(on&&S.page==='ayar')S.page='satis';render();toast(on?'Düzenleme modu açık':'Düzenleme modu kapandı')}
document.addEventListener('click',e=>{if(!S.edit||S.bypass)return;const t=e.target;if(t.closest('#modal,#edbar,#toast'))return;if(/^(INPUT|SELECT|TEXTAREA|OPTION)$/.test(t.tagName))return;
 const tk=t.closest('[data-tk]'),hk=t.closest('[data-hk]'),ck=t.closest('[data-ck]');if(!tk&&!hk&&!ck)return;e.preventDefault();e.stopPropagation();
 window._ed={tk:tk&&tk.dataset.tk,td:tk&&tk.dataset.td,hk:hk&&hk.dataset.hk,ck:ck&&ck.dataset.ck,el:t.closest('button,a')};edModal()},true);
function edModal(){const x=window._ed,u=UI();let h=mHead('Düzenle');
 if(x.tk)h+=`<label class="f">Yazı<input class="in" id="edt" autofocus value="${esc(u.tx[x.tk]||x.td)}" onkeydown="if(event.key==='Enter')edSave()"></label><div class="row"><span class="muted">Varsayılan: ${esc(x.td)}</span><button class="btn sm sp" onclick="$('#edt').value=window._ed.td">Varsayılana al</button></div>`;
 if(x.ck){const cur=colVal(x.ck);h+=`<div class="f" style="font-size:.82rem;font-weight:600;color:var(--tx2)">Renk<div class="row">${SW.map(c=>`<button class="swatch ${cur.toLowerCase()===c.toLowerCase()?'on':''}" style="background:${c}" aria-label="Renk ${c}" onclick="window._ed.col='${c}';document.querySelectorAll('#modal .swatch').forEach(b=>b.classList.remove('on'));this.classList.add('on')"></button>`).join('')}<label class="chip" style="gap:8px">Özel<input type="color" value="${cur}" oninput="window._ed.col=this.value" style="width:28px;height:24px;border:0;background:none;padding:0"></label><button class="btn sm" onclick="window._ed.col='def';toast('Kaydedince varsayılan renge döner')">Varsayılan</button></div></div>`}
 if(x.hk&&!NOHIDE.includes(x.hk)){const hd=!!u.hide[x.hk];h+=`<div class="tgl" onclick="const w=this.querySelector('.sw');window._ed.hide=!w.classList.contains('on');w.classList.toggle('on')"><div>Bu öğeyi gizle<small>Gizlenen öğeler düzenleme modunda soluk görünür, normalde hiç görünmez</small></div><span class="sw ${hd?'on':''}"><i></i></span></div>`}
 h+=`<div class="row">${x.el?`<button class="btn" onclick="edUse()">Normal tıkla</button>`:''}<button class="btn sp" onclick="closeM()">Vazgeç</button><button class="btn pri" onclick="edSave()">Kaydet</button></div>`;modal(h)}
function edSave(){const x=window._ed,u=UI();
 if(x.tk){const v=$('#edt').value.trim();if(!v||v===x.td)delete u.tx[x.tk];else u.tx[x.tk]=v}
 if(x.ck&&x.col)setColRaw(x.ck,x.col==='def'?null:x.col);
 if(x.hk&&x.hide!==undefined){if(x.hide)u.hide[x.hk]=true;else delete u.hide[x.hk]}

function edUse(){const el=window._ed.el;closeM();S.bypass=true;try{el.click()}finally{S.bypass=false}}

const KL=a=>UI().keys[a]||KEYDEF[a][0];

function payBtns(){const u=UI();const o=ordSort(PAYK,u.order.pay).filter(k=>!isHid('pay_'+k));
 const big=o.filter(k=>k==='nakit'||k==='kart').map(k=>`<button class="pb pbr"${HA('pay_'+k)} data-ck="${k}" style="background:var(--c-${k})" onclick="${PAYD[k][1]}"><span class="pem" aria-hidden="true">${k==='nakit'?'💵':'💳'}</span><span class="pbt">${T('pay_'+k,PAYD[k][0])}<small>${kn(KL(k))}</small></span></button>`).join('');
 const sm=o.filter(k=>k!=='nakit'&&k!=='kart').map(k=>k==='parcali'?`<button${HA('pay_parcali')} onclick="${PAYD[k][1]}">${T('pay_parcali','Parçalı')}<small>${kn(KL('parcali'))}</small></button>`:`<button class="pc"${HA('pay_'+k)} data-ck="${k}" style="--pc:var(--c-${k})" onclick="${PAYD[k][1]}">${T('pay_'+k,PAYD[k][0])}<small>${kn(KL(k))}</small></button>`).join('');
 return [big,sm]}
function auxBtns(){const u=UI();return ordSort(AUXK,u.order.aux).map(k=>{if(isHid('aux_'+k))return '';const d=AUXD[k];

function keysBar(){return Object.keys(KEYDEF).filter(a=>!(ACTHIDE[a]&&UI().hide[ACTHIDE[a]])).map(a=>`<span><b>${kn(KL(a))}</b> ${esc(keyLbl(a))}</span>`).join('')+'<span><b>3*</b> Adet çarp</span><span class="sp" id="fcount"></span>'}
function capKey(a){S.capKey=a;modal(mHead('Kısayol: '+esc(keyLbl(a)))+`<p style="margin:0;line-height:1.6">Şimdi bu işlem için kullanmak istediğin tuşa bas. F1–F12 tuşları önerilir; harf tuşları sadece imleç bir kutuda değilken çalışır.</p><p class="muted" style="margin:0">Şu anki tuş: <b class="mono">${kn(KL(a))}</b></p><div class="row"><button class="btn" onclick="S.capKey=null;delete UI().keys['${a}'];save();closeM();render()">Varsayılana dön (${kn(KEYDEF[a][0])})</button><button class="btn sp" onclick="S.capKey=null;closeM()">Vazgeç</button></div>`)}
function setKey(k){const a=S.capKey;if(['Shift','Control','Alt','Meta','Tab','Enter','CapsLock'].includes(k))return;const other=Object.keys(KEYDEF).find(x=>x!==a&&KL(x)===k);if(other){toast(kn(k)+' tuşu "'+keyLbl(other)+'" için kullanılıyor');return}
 S.capKey=null;if(k===KEYDEF[a][0])delete UI().keys[a];else UI().keys[a]=k;save();closeM();render();toast(keyLbl(a)+': '+kn(k))}
function ordMove(kind,key,dir){const base={menu:MENU.map(m=>m[0]),pay:PAYK,aux:AUXK}[kind];const o=ordSort(base,UI().order[kind]);const i=o.indexOf(key),j=i+dir;if(j<0||j>=o.length)return;[o[i],o[j]]=[o[j],o[i]];UI().order[kind]=o;save();render()}
const qSort=(a,b)=>((a.qo??999)-(b.qo??999))||a.name.localeCompare(b.name,'tr');
function qMove(id,dir){const l=D.products.filter(p=>p.quick).sort(qSort);const i=l.findIndex(p=>p.id===id),j=i+dir;if(j<0||j>=l.length)return;[l[i],l[j]]=[l[j],l[i]];l.forEach((p,n)=>p.qo=n);save();render()}
function hideTog(k){const u=UI();if(u.hide[k])delete u.hide[k];else u.hide[k]=true;save();render()}
function edCard(){const u=UI();
 const ordRow=(lbl,kind,key,hk,i,n)=>`<div class="row" style="flex-wrap:nowrap;padding:6px 0;border-bottom:1px solid var(--line)"><span style="flex:1;${u.hide[hk]?'opacity:.45;text-decoration:line-through':''}">${esc(lbl)}</span>${hk&&!NOHIDE.includes(hk)?`<button class="btn sm" onclick="hideTog('${hk}')">${u.hide[hk]?'Göster':'Gizle'}</button>`:''}<button class="ib" aria-label="Yukarı" onclick="ordMove('${kind}','${key}',-1)" ${i===0?'disabled':''}>↑</button><button class="ib" aria-label="Aşağı" onclick="ordMove('${kind}','${key}',1)" ${i===n-1?'disabled':''}>↓</button></div>`;
 const mo=ordSort(MENU.map(m=>m[0]),u.order.menu),po=ordSort(PAYK,u.order.pay),ao=ordSort(AUXK,u.order.aux);
 const ql=D.products.filter(p=>p.quick).sort(qSort);
 return `<div class="card" style="grid-column:1/-1"><div class="row"><h2>Kişiselleştirme</h2><button class="btn pri sp" onclick="editMode(true)">Düzenleme modunu aç</button></div>
 <p class="muted" style="margin:0;line-height:1.6">Düzenleme modunda ekrandaki yazılara, butonlara ve panellere dokunup adını ve rengini değiştirebilir ya da gizleyebilirsin. Sıralama, renk, yazı tipi ve kısayolları buradan da ayarlayabilirsin. Tüm değişiklikler bütün cihazlara uygulanır.</p>
 <div class="g3" style="align-items:start"><div><h2 style="margin-bottom:6px">Menü</h2>${mo.map((k,i)=>ordRow(Tp('menu_'+k,MENU.find(m=>m[0]===k)[1]),'menu',k,'menu_'+k,i,mo.length)).join('')}</div>
 <div><h2 style="margin-bottom:6px">Ödeme butonları</h2>${po.map((k,i)=>ordRow(Tp('pay_'+k,PAYD[k][0]),'pay',k,'pay_'+k,i,po.length)).join('')}<h2 style="margin:14px 0 6px">Yardımcı butonlar</h2>${ao.map((k,i)=>ordRow(Tp('aux_'+k,AUXD[k][0]),'aux',k,'aux_'+k,i,ao.length)).join('')}
 <h2 style="margin:14px 0 6px">Satış ekranı parçaları</h2>${[['quick','Hızlı ürünler paneli'],['top_siparis','Siparişler butonu'],['cust_row','Müşteri satırı'],['rec_box','Alınan / para üstü'],['cash_chips','Hızlı para butonları'],['keys','Kısayol çubuğu']].map(([k,l])=>`<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)"><span style="flex:1;${u.hide[k]?'opacity:.45;text-decoration:line-through':''}">${l}</span><button class="btn sm" onclick="hideTog('${k}')">${u.hide[k]?'Göster':'Gizle'}</button></div>`).join('')}</div>

 if(e.mode==='label'){const [w,h]=E2S[e.lsz];return {n:q.length,w,h,pages:q.map(p=>`<div class="e2pg e2tag" style="width:${w}mm;height:${h}mm">${e2Lbl(p,h>=40?'l':'m')}</div>`)}}
