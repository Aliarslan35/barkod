<style>
:root{--bg:#EEF1F5;--surf:#FFFFFF;--surf2:#F7F8FA;--line:#E2E6EC;--line2:#CBD2DC;--tx:#14181F;--tx2:#3A4556;--tx3:#5A6578;--panel:#0F1A2E;--acc:#1F5FD6;--ok:#157347;--okTx:#136334;--okSoft:#E7F6EE;--bad:#C92A2A;--badTx:#A61E1E;--badSoft:#FDE8E8;--warn:#B8440A;--warnTx:#8A3A08;--warnSoft:#FDEDE3;--vio:#5B3FC4;--org:#E8590C;--fs:16px;--c-nakit:#157347;--c-kart:var(--acc);--c-havale:#5B3FC4;--c-veresiye:#B8440A;--c-iade:#C92A2A;--c-siparis:#E8590C;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1219;--surf:#161D29;--surf2:#1C2533;--line:#263042;--line2:#36445C;--tx:#E8ECF2;--tx2:#C3CCD9;--tx3:#98A5B8;--panel:#090E16;--okTx:#78D9A3;--okSoft:#12301F;--badTx:#FF9B9B;--badSoft:#3A1A1C;--warnTx:#FFB27D;--warnSoft:#3A2414;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1219;--surf:#161D29;--surf2:#1C2533;--line:#263042;--line2:#36445C;--tx:#E8ECF2;--tx2:#C3CCD9;--tx3:#98A5B8;--panel:#090E16;--okTx:#78D9A3;--okSoft:#12301F;--badTx:#FF9B9B;--badSoft:#3A1A1C;--warnTx:#FFB27D;--warnSoft:#3A2414;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);font-size:var(--fs)}
html,body{height:100%;margin:0}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:var(--font,'Plus Jakarta Sans'),'Segoe UI',system-ui,sans-serif;font-size:1rem;-webkit-tap-highlight-color:transparent}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
#app{height:100%;display:flex;flex-direction:column}
.btn{min-height:44px;padding:0 16px;border:1.5px solid var(--line2);border-radius:10px;background:var(--surf);font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.btn.okb{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
.btn.danger{border-color:var(--bad);color:var(--badTx);font-weight:700}
.btn.sm{min-height:36px;padding:0 12px;font-size:.82rem}
.ib{width:40px;height:40px;border:1px solid var(--line2);border-radius:9px;background:var(--surf);display:inline-flex;align-items:center;justify-content:center;font-size:1.1rem;padding:0}
.ib.ghost{border:0;background:transparent;color:var(--tx3)}
input.in,select.in{width:100%;min-height:46px;padding:0 12px;border:1.5px solid var(--line2);border-radius:10px;background:var(--surf);font-size:1rem}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.82rem;font-weight:600;color:var(--tx2)}
.seg{display:inline-flex;gap:4px;padding:4px;background:color-mix(in srgb,var(--tx) 8%,var(--surf));border-radius:10px;flex-wrap:wrap}
.seg button{min-height:36px;padding:0 12px;border:0;border-radius:8px;background:transparent;font-size:.82rem;font-weight:600;color:var(--tx2)}
.seg button.on{background:var(--surf);color:var(--tx);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.chip{display:inline-flex;align-items:center;min-height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:var(--surf2);font-size:.82rem;font-weight:600;color:var(--tx2)}
.chip.on{background:color-mix(in srgb,var(--acc) 14%,var(--surf));border-color:color-mix(in srgb,var(--acc) 40%,var(--surf));color:var(--tx)}
.tag{font-size:.75rem;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
.t-Nakit{background:var(--okSoft);color:var(--okTx)}
.t-Kart{background:color-mix(in srgb,var(--acc) 14%,var(--surf));color:var(--tx)}
.t-Havale{background:color-mix(in srgb,var(--vio) 16%,var(--surf));color:var(--tx)}
.t-Veresiye{background:var(--warnSoft);color:var(--warnTx)}
.t-Parçalı{background:var(--surf2);color:var(--tx2)}
.t-iade{background:var(--badSoft);color:var(--badTx)}
.card{background:var(--surf);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
h1{margin:0;font-size:1.6rem;font-weight:800;letter-spacing:-.4px}
h2{margin:0;font-size:1rem;font-weight:800}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{margin-left:auto}
.muted{color:var(--tx3);font-size:.85rem}
.kbd{font-family:'JetBrains Mono',monospace;font-size:.7rem;font-weight:700;padding:2px 6px;border:1px solid var(--line2);border-radius:5px;color:var(--tx3)}
.login{min-height:100%;display:grid;grid-template-columns:1fr 1fr}
.login .lp{background:var(--panel);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.login .lp h1{font-size:2.4rem;line-height:1.15;color:#fff}
.login .lf{display:flex;align-items:center;justify-content:center;padding:32px 20px}
.login .box{width:100%;max-width:440px;display:flex;flex-direction:column;gap:18px}
.logo{display:flex;align-items:center;gap:12px;font-weight:800;font-size:1.2rem}
.logo i{width:44px;height:44px;border-radius:11px;background:var(--acc);display:flex;align-items:center;justify-content:center}
.users{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.user{min-height:56px;border:1.5px solid var(--line2);border-radius:12px;background:var(--surf);display:flex;align-items:center;gap:10px;padding:0 12px;font-weight:600;text-align:left}
.user.on{border:2px solid var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--surf));font-weight:700}
.av{width:34px;height:34px;border-radius:50%;background:color-mix(in srgb,var(--tx) 10%,var(--surf));display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:800;flex:none}
.user.on .av{background:var(--acc);color:#fff}
.err{color:var(--badTx);font-weight:700;font-size:.9rem}
@media (max-width:820px){.login{grid-template-columns:1fr}
.login .lp{padding:28px 22px;border-radius:0 0 24px 24px}
.login .lp h1{font-size:1.6rem}
.login .lp .big{display:none}}
.top{background:var(--panel);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 14px;flex:none}
.top .tb{min-height:44px;padding:0 14px;border:0;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;font-weight:700;display:flex;align-items:center;gap:8px}
.top .brand{font-weight:800;white-space:nowrap}
.scan{flex:1;position:relative;display:flex;align-items:center;gap:10px;min-height:46px;padding:0 12px;background:var(--surf);color:var(--tx3);border-radius:10px;min-width:0}
.scan input{flex:1;border:0;outline:0;background:transparent;color:var(--tx);font-size:1rem;min-width:0;height:44px}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surf);color:var(--tx);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:30;overflow:hidden}
.sugg button{display:flex;width:100%;justify-content:space-between;gap:10px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left}
.sugg button:hover{background:var(--surf2)}
.ordb{min-height:44px;padding:0 14px;border:0;border-radius:10px;background:var(--c-siparis);color:#fff;font-weight:700;display:flex;align-items:center;gap:8px;white-space:nowrap}
.ordb b{background:#fff;color:#A53F08;border-radius:10px;padding:0 8px;font-size:.8rem}
.who{text-align:right;line-height:1.25;white-space:nowrap;font-size:.85rem;font-weight:700}
.who small{color:#C9D3E3;font-weight:500}
.pos{flex:1;min-height:0;display:grid;grid-template-columns:1fr minmax(320px,400px) 330px;grid-template-areas:"cart quick pay";gap:12px;padding:12px}
.cart{grid-area:cart;padding:0;overflow:hidden}
.quick{grid-area:quick;min-height:0}
.pay{grid-area:pay;display:flex;flex-direction:column;gap:12px;min-height:0}
.ctabs{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}

 return {id:nid(),no:nextFis(d),date:new Date().toISOString(),user:u?u.name:'',items:items.map(l=>({...l})),sub,disc,total,pay,parts:parts||null,cust,ret,demo:!!demo};

function renderLogin(){
 const us=D.users;let u=us.find(x=>x.id===S.uSel);
 if(!u){const l=+lsGet('lastUid');u=us.find(x=>x.id===l)||us[0];S.uSel=u?u.id:null}
 S.pin='';const lastId=+lsGet('lastUid');const rol=x=>x.role==='yonetici'?'Yönetici':'Kasiyer';
 let box;
 if(!u||S.lsw){
  box=`<h1 class="lg-h">Kim giriş yapacak?</h1><div class="lg-users">${us.map(x=>`<button class="lg-u ${x.id===lastId?'on':''}" onclick="S.uSel=${x.id};S.lsw=false;renderLogin()"><span class="lg-av">${ini(x.name)}</span><b>${esc(x.name)}</b><small>${rol(x)}</small></button>`).join('')||'<p class="lg-hint">Kayıtlı kullanıcı yok</p>'}</div>`;
 }else{
  const n=Math.max(1,String(u.pw||'').length);const fp=fpOk();const def=(u.role==='yonetici'&&u.pw==='0000')||(u.role!=='yonetici'&&u.pw==='1234');
  const key=k=>k===''?'<span></span>':k==='fp'?`<button class="fn" aria-label="Parmak izi ile giriş" onclick="fpLogin()">${ic('fp',28)}</button>`:k==='⌫'?`<button class="fn" aria-label="Sil" onclick="pinK('⌫')">⌫</button>`:`<button onclick="pinK('${k}')">${k}</button>`;
  box=`<button class="lg-me" ${us.length>1?'onclick="S.lsw=true;renderLogin()"':'disabled'}><span class="lg-av big">${ini(u.name)}</span><b>${esc(u.name)}</b><small>${rol(u)}${us.length>1?' · Değiştir':''}</small></button>
  <div class="lg-dots" id="dots">${'<i></i>'.repeat(n)}</div><div id="lerr" class="lg-err" role="alert"></div>
  <div class="lg-pad">${['1','2','3','4','5','6','7','8','9',fp?'fp':'','0','⌫'].map(key).join('')}</div>
  ${def?`<p class="lg-hint">İlk şifre <b>${esc(u.pw)}</b>. Girişten sonra Ayarlar'dan değiştir.</p>`:''}`;
 }
 $('#app').innerHTML=`<div class="lg"><div class="lg-top"><i class="lg-logo">${LOGO.replace(/lgG/g,'lgG4')}</i><b>${esc(D.set.market)}</b></div><div class="lg-box">${box}</div><button class="lg-out" onclick="acctOut()">Market hesabından çık</button></div>`;
}
function pinK(k){const u=D.users.find(x=>x.id===S.uSel);if(!u)return;
 if(k==='Sil')S.pin='';else if(k==='⌫')S.pin=S.pin.slice(0,-1);else S.pin+=k;
 const d=$('#dots');if(!d)return;[...d.children].forEach((x,i)=>x.classList.toggle('on',i<S.pin.length));
 if(S.pin.length>=String(u.pw||'').length){if(S.pin===String(u.pw)){loginOK(u)}else{d.classList.add('err');beep(false);const e=$('#lerr');if(e)e.textContent='Şifre yanlış. Tekrar dene.';setTimeout(()=>{S.pin='';d.classList.remove('err');[...d.children].forEach(x=>x.classList.remove('on'))},450)}}}
function loginOK(u){S.user=u;S.lsw=false;S.pin='';lsSet('lastUid',u.id);if(S.fpReg){S.fpReg=false;fpRegister(u)}if(!S.carts.length)newCart();nav(u.role==='yonetici'?'ana':'satis')}
/* parmak izi: bu cihaza bağlanır (WebAuthn) */
const fpOk=()=>!!(window.PublicKeyCredential&&navigator.credentials&&window.isSecureContext);
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));const ub64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function fpLogin(){const u=D.users.find(x=>x.id===S.uSel);if(!u)return;const id=lsGet('fp_'+u.id);
 if(!id){S.fpReg=true;toast('Parmak izini bu cihaza bağlamak için önce şifreni gir');return}
 try{await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:ub64(id)}],userVerification:'required',timeout:60000}});loginOK(u)}catch(e){toast('Parmak izi doğrulanamadı')}}
async function fpRegister(u){try{const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Barkod Sistemi'},user:{id:new TextEncoder().encode('u'+u.id+'-'+Date.now()),name:u.name,displayName:u.name},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});lsSet('fp_'+u.id,b64(c.rawId));toast('Parmak izi bu cihaza bağlandı')}catch(e){toast('Parmak izi bağlanamadı')}}
document.addEventListener('keydown',e=>{if(!D||S.user||S.page!=='login'||S.lsw||$('#modal').innerHTML||!$('#dots'))return;
 if(e.key==='Backspace'){e.preventDefault();pinK('⌫')}else if(e.key==='Escape'){pinK('Sil')}else if(e.key.length===1&&!e.ctrlKey&&!e.metaKey){e.preventDefault();pinK(e.key)}});

function sugg(){const {v}=parseScan($('#scan').value);const g=$('#sg');if(v.length<2||/^\d{8,}$/.test(v)){g.innerHTML='';return}const r=matches(v);g.innerHTML=r.map(p=>`<button onclick="pickSug(${p.id})"><span><b>${esc(p.name)}</b> <span class="muted mono">${p.barcode}</span></span><b>${tl(p.price)}</b></button>`+(p.pack>1?`<button onclick="addPack(${p.id})"><span><b>${esc(p.name)}</b> <span class="tag t-Kart">Koli ${p.pack}</span></span><b>${tl(p.packPrice||p.price*p.pack)}</b></button>`:'')).join('')}
function pickSug(id){const {q}=parseScan($('#scan').value);addP(id,q??undefined)}
function scanKey(e){
 if(e.key!=='Enter')return;e.preventDefault();const raw=$('#scan').value;const {q,v}=parseScan(raw);if(!v)return;
 if(!findCode(v)){const w=scaleParse(v);if(w&&w.p){if(!(w.q>0)){toast('Tartı barkodunda miktar okunamadı');beep(false);return}return addP(w.p.id,w.q)}if(w&&w.miss){beep(false);toast('Terazi ürün kodu '+w.miss+' kayıtlı değil. Ürünün barkod alanına bu kodu yaz.');return}}
 {const pk=D.products.find(x=>x.packBc&&x.packBc===v);if(pk)return addPack(pk.id,q??undefined)}
 let p=findCode(v);if(!p){const r=matches(v);if(r.length)p=r[0]}
 if(p)return addP(p.id,q??undefined);
 beep(false);$('#sg').innerHTML='';
 unregAsk(v,q);
}

function validEan(c){if(!/^\d+$/.test(c)||![8,12,13].includes(c.length))return false;const d=[...c].map(Number);const ch=d.pop();let t=0;d.reverse().forEach((x,i)=>t+=x*(i%2?1:3));return (10-t%10)%10===ch}
function onScanCode(code){const p=findCode(code);if(p)addP(p.id);else{const s=$('#scan');if(s){s.value=code;scanKey({key:'Enter',preventDefault(){}})}}}

const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const camBad=l=>/wide|ultra|depth|macro|front|ön|user|tele|0[.,]5/i.test(l||'');
const camGood=l=>/back|rear|main|primary|arka|\b0\b/i.test(l||'');
async function pickCam(){
 if(lsGet('camV')!=='3'){lsSet('camId','');lsSet('camV','3')}
 const saved=lsGet('camId');if(saved)return saved;
 let devs=[];try{devs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput')}catch(e){}
 if(!devs.length||!devs[0].label){try{const t=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});t.getTracks().forEach(x=>x.stop());devs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput')}catch(e){return ''}}
 let cands=devs.filter(d=>!/front|ön|user/i.test(d.label));if(!cands.length)cands=devs;
 if(cands.length===1){lsSet('camId',cands[0].deviceId);return cands[0].deviceId}
 camSt('Kamera hazırlanıyor… (sadece ilk seferde birkaç saniye)');let best=null,bs=-1e9;
 for(const d of cands){let sc=0;if(camBad(d.label))sc-=100;if(camGood(d.label))sc+=50;
  try{const st=await navigator.mediaDevices.getUserMedia({audio:false,video:{deviceId:{exact:d.deviceId}}});const tr=st.getVideoTracks()[0];const c=tr.getCapabilities?tr.getCapabilities():{};
   if(c.focusMode&&c.focusMode.includes('continuous'))sc+=100;if(c.focusDistance&&c.focusDistance.max>0)sc+=20;if(c.width&&c.width.max)sc+=Math.min(40,c.width.max/100);
   st.getTracks().forEach(x=>x.stop())}catch(e){sc-=500}
  if(sc>bs){bs=sc;best=d}}
 if(best){lsSet('camId',best.deviceId);return best.deviceId}return ''}
async function camScan(cb,opt){
 window._camCb=cb||onScanCode;stopCam();window._camCont=!!(opt&&opt.cont);
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){modal(mHead('Kamerayla okutma')+`<p style="margin:0;line-height:1.6">Bu tarayıcı kameraya erişemiyor. Uygulamayı Chrome'da (Android) ya da Safari'de (iPhone/iPad) aç.</p><button class="btn pri" onclick="closeM()">Tamam</button>`);return}
 modal(mHead(window._camCont?'El terminali':'Barkodu okut')+`<div style="position:relative;border-radius:12px;overflow:hidden;background:#000"><video id="cv" playsinline muted style="width:100%;display:block"></video><div style="position:absolute;left:10%;right:10%;top:32%;height:36%;border:3px solid #FFD43B;border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none"></div></div>
 <p class="muted" id="cst" style="margin:0;line-height:1.5">Barkodu sarı çerçeveye getir.</p>${window._camCont?'<div id="ctl"></div>':''}
 <button class="btn" onclick="stopCam();closeM()">Kapat</button>`);
 const id=await pickCam();if(!$('#cv'))return;let st;
 const vc={width:{ideal:1280},height:{ideal:720}};
 try{st=await navigator.mediaDevices.getUserMedia({audio:false,video:id?{...vc,deviceId:{exact:id}}:{...vc,facingMode:{ideal:'environment'}}})}
 catch(e){lsSet('camId','');try{st=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'}}})}catch(e2){closeM();toast('Kameraya izin verilmedi');return}}
 const v=$('#cv');if(!v){st.getTracks().forEach(t=>t.stop());return}
 window._cs=st;window._camOn=true;window._barSeen={};window._ocrSeen={};window._camT0=Date.now();v.srcObject=st;try{await v.play()}catch(e){}
 const tr=st.getVideoTracks()[0];window._ctr=tr;let caps={};try{caps=tr.getCapabilities?tr.getCapabilities():{}}catch(e){}
 try{if(caps.focusMode&&caps.focusMode.includes('continuous'))await tr.applyConstraints({advanced:[{focusMode:'continuous'}]});else if(caps.focusMode&&caps.focusMode.includes('single-shot'))await tr.applyConstraints({advanced:[{focusMode:'single-shot'}]})}catch(e){}
 camSt('Barkodu sarı çerçeveye getir.');
 barLoop(v);ocrStart();
}

 const now=Date.now();let n=0;

 ${rcv()?'<p class="err" style="margin:0">Bu cihaz alıcı olarak ayarlı. El terminali olarak kullanacaksan Ayarlar › Satış ekranı bölümünden "Bu cihaz telefondan okutulanları alsın" ayarını kapat.</p>':''}

function camDone(code,src){if(!window._camOn)return;
 if(window._camCont){const now=Date.now();if(now<(window._camPause||0))return;if(code===window._camLast&&now-window._camLastT<2500)return;window._camLast=code;window._camLastT=now;window._camPause=now+800;window._barSeen={};window._ocrSeen={};beep(true);const cb=window._camCb;cb&&cb(code);return}
 window._camOn=false;stopCam();beep(true);closeM();const cb=window._camCb;cb&&cb(code)}
async function getDet(){if(window._det!==undefined)return window._det;window._det=null;
 try{if('BarcodeDetector' in window){const f=await BarcodeDetector.getSupportedFormats();if(f.includes('ean_13'))return window._det=new BarcodeDetector({formats:f.filter(x=>['ean_13','ean_8','upc_a'].includes(x))})}}catch(e){}
 try{const m=await import('https://cdn.jsdelivr.net/npm/barcode-detector@2/dist/es/pure.min.js');window._det=new m.BarcodeDetector({formats:['ean_13','ean_8','upc_a']})}catch(e){window._det=null}
 return window._det}
function crop(v,cv,maxW){const sx=v.videoWidth*.10,sy=v.videoHeight*.32,sw=v.videoWidth*.80,sh=v.videoHeight*.36,sc=Math.min(1.5,maxW/sw);cv.width=Math.round(sw*sc);cv.height=Math.round(sh*sc);cv.getContext('2d',{willReadFrequently:true}).drawImage(v,sx,sy,sw,sh,0,0,cv.width,cv.height);return cv}
async function barLoop(v){const det=await getDet();if(!det)return;
 const cv=document.createElement('canvas');let last='';
 while(window._camOn){try{if(v.readyState>=2&&v.videoWidth){const r=await det.detect(crop(v,cv,900));let got='';
   for(const x of (r||[])){const c=String(x.rawValue||'').trim();if(validEan(c)){got=c;break}}
   if(got){if(got===last||findCode(got)&&window._barSeen[got]){camDone(got,'cizgi');if(!window._camCont)return;last='';continue}window._barSeen[got]=1;last=got}}}catch(e){}
  await new Promise(r=>setTimeout(r,60))}}
function loadTess(){if(window.Tesseract)return Promise.resolve();if(window._tessP)return window._tessP;window._tessP=new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';sc.onload=ok;sc.onerror=()=>{window._tessP=null;no()};document.head.appendChild(sc)});return window._tessP}
async function getOcr(){if(window._ocr)return window._ocr;if(window._ocrP)return window._ocrP;
 window._ocrP=(async()=>{await loadTess();const w=await Tesseract.createWorker('eng');await w.setParameters({tessedit_char_whitelist:'0123456789',tessedit_pageseg_mode:'6'});window._ocr=w;return w})();
 try{return await window._ocrP}catch(e){window._ocrP=null;throw e}}
function ocrPick(text){const seen=window._ocrSeen;const lines=text.split('\n').map(l=>l.replace(/\D/g,'')).filter(l=>l.length>=8);
 for(const l of lines)for(const n of [13,12,8])for(let i=0;i+n<=l.length;i++){const c=l.slice(i,i+n);if(!validEan(c))continue;
  if(window._barSeen[c]||findCode(c))return c;if(l.length===n){seen[c]=(seen[c]||0)+1;if(seen[c]>=2)return c}}
 return null}
async function ocrStart(){if(window._ocrOn)return;window._ocrOn=true;const v=$('#cv');
 let w;try{w=await getOcr()}catch(e){window._ocrOn=false;return}
 const cv=document.createElement('canvas');const t0=Date.now();
 while(window._camOn){try{if(v&&v.readyState>=2&&v.videoWidth){crop(v,cv,1000);const cx=cv.getContext('2d',{willReadFrequently:true});const im=cx.getImageData(0,0,cv.width,cv.height),d=im.data;let sum=0;for(let i=0;i<d.length;i+=4){const g=d[i]*.3+d[i+1]*.59+d[i+2]*.11;d[i]=g;sum+=g}const avg=sum/(d.length/4);for(let i=0;i<d.length;i+=4){const g=d[i]>avg*.85?255:0;d[i]=d[i+1]=d[i+2]=g}cx.putImageData(im,0,0);
   const r=await w.recognize(cv);const c=ocrPick(r.data.text||'');if(c){camDone(c,'rakam');if(!window._camCont){window._ocrOn=false;return}}}}catch(e){}await new Promise(r=>setTimeout(r,150))}
 window._ocrOn=false}

const WEB_RULES=`rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /markets/{uid}/{document=**} {
      allow read, write: if request.auth != null && request.auth.uid == uid;
    }
    match /shops/{sid} {
      allow read: if true;
      allow write: if request.auth != null && request.auth.uid == sid;
      match /cat/{part} {
        allow read: if true;
        allow write: if request.auth != null && request.auth.uid == sid;
      }
      match /orders/{oid} {
        allow get: if true;
        allow list, update, delete: if request.auth != null && request.auth.uid == sid;
        allow create: if request.resource.data.keys().hasOnly(['name','phone','addr','note','del','pay','items','total','fee','ts','st'])
          && request.resource.data.st == 'Yeni'
          && request.resource.data.name is string && request.resource.data.name.size() > 1 && request.resource.data.name.size() <= 60
          && request.resource.data.phone is string && request.resource.data.phone.size() >= 10 && request.resource.data.phone.size() <= 20
          && request.resource.data.addr is string && request.resource.data.addr.size() <= 300
          && request.resource.data.note is string && request.resource.data.note.size() <= 300
          && request.resource.data.items is list && request.resource.data.items.size() > 0 && request.resource.data.items.size() <= 80
          && request.resource.data.total is number
          && get(/databases/$(database)/documents/shops/$(sid)).data.on == true;
      }
    }
  }
}`;

const OFF_HOSTS=['world.openfoodfacts.org','world.openbeautyfacts.org','world.openproductsfacts.org'];
async function offLookup(code){
 for(const h of OFF_HOSTS){try{const ac=new AbortController();const t=setTimeout(()=>ac.abort(),6000);
  const r=await fetch(`https://${h}/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name_tr,product_name,generic_name_tr,brands,quantity,image_front_small_url,image_small_url`,{signal:ac.signal});clearTimeout(t);
  if(!r.ok)continue;const j=await r.json();if(j.status!==1||!j.product)continue;const p=j.product;
  let name=(p.product_name_tr||p.product_name||p.generic_name_tr||'').trim();if(!name)continue;
  const q=(p.quantity||'').trim();if(q&&!name.toLowerCase().includes(q.toLowerCase().replace(/\s/g,'').slice(0,3)))name+=' '+q;
  const brand=(p.brands||'').split(',')[0].trim();return {name,brand,img:p.image_front_small_url||p.image_small_url||''}}catch(e){}}
 return null}

/* tedarikçi borçları: ödeme bilgisi alışın ilk satırında (pay, pd, due); ödemeler purchases içinde kind:'pay' */
const isPayRec=b=>b&&b.kind==='pay';
const PAYS=[['Nakit','💵 Nakit'],['Kart','💳 Kart'],['Havale','🏦 Havale/EFT'],['Borç','📒 Borç (veresiye)']];
const PAYS_RET=[['Borç','📒 Borçtan düş'],['Nakit','💵 Nakit geri aldım'],['Kart','💳 Karta iade'],['Havale','🏦 Havale ile']];
function supLedger(s){const gs={},pays=[];
 D.purchases.forEach(b=>{if(supOf(b.sup)!==s)return;if(isPayRec(b)){pays.push(b);return}const k=b.grp||b.id;
  const g=gs[k]=gs[k]||{grp:k,date:b.date,inv:'',T:0,pay:null,pd:0,due:'',ret:!!b.ret,photo:''};g.T+=(b.qty||0)*(b.cost||0);if(b.inv)g.inv=b.inv;if(b.photo)g.photo=b.photo;if(b.pay){g.pay=b.pay;g.pd=b.pd||0;g.due=b.due||''}});
 const inv=Object.values(gs).map(g=>{g.T=r2(g.T);g.debt=g.pay?r2(g.pay==='Borç'?g.T-g.pd:0):0;return g}).sort((a,b)=>a.date<b.date?-1:1);
 const paid=pays.reduce((a,p)=>a+(p.amt||0),0);let cr=paid+inv.filter(g=>g.debt<0).reduce((a,g)=>a-g.debt,0);
 inv.forEach(g=>{if(g.debt>0){const u=Math.min(cr,g.debt);g.rem=r2(g.debt-u);cr=r2(cr-u)}else g.rem=0});
 const bal=r2(inv.reduce((a,g)=>a+g.debt,0)-paid);const td=ymd(new Date());const od=inv.filter(g=>g.rem>0&&g.due&&g.due<td);const soon=inv.filter(g=>g.rem>0&&g.due&&g.due>=td);
 const mv=[...inv.filter(g=>g.pay).map(g=>({date:g.date,t:g.ret?'İade':'Mal alışı',T:g.T,a:g.debt,g})),...pays.map(p=>({date:p.date,t:'Ödeme',T:p.amt,a:-p.amt,p}))].sort((a,b)=>a.date<b.date?-1:1);
 let run=0;mv.forEach(m=>{run=r2(run+m.a);m.bal=run});
 return {bal,inv,od,odT:r2(od.reduce((a,g)=>a+g.rem,0)),soon,mv}}

 const row=m=>{if(m.p)return `<tr><td>${fdd(m.date)}</td><td><b>Ödeme</b> ${payTag(m.p.pay)}${m.p.note?`<div class="muted" style="font-size:.75rem">${esc(m.p.note)}</div>`:''}</td><td class="r" style="color:var(--okTx);font-weight:700">-${tl(m.T)}</td><td class="r">${tl(m.bal)}</td><td class="r"><button class="ib ghost" aria-label="Ödemeyi sil" onclick="ask('Bu ödeme kaydı silinsin mi?',()=>{D.purchases=D.purchases.filter(x=>x.id!==${m.p.id});save();render()})">${ic('trash',16)}</button></td></tr>`;
  const g=m.g;const st=g.pay!=='Borç'?payTag(g.pay)+' <span class="muted">ödendi</span>':g.ret?'<span class="muted">borçtan düştü</span>':g.rem<=0?'<span class="tag t-Nakit">Ödendi</span>':g.due?`<span class="tag ${g.due<td?'t-iade':'t-Veresiye'}">Vade ${fdd(g.due+'T12:00')}${g.due<td?' · geçti':''}</span>`:'<span class="tag t-Veresiye">Borç</span>';
  return `<tr><td>${fdd(m.date)}</td><td><b>${m.t}</b>${g.inv?` <span class="muted">#${esc(g.inv)}</span>`:''} ${st}${g.pay==='Borç'&&g.pd?`<div class="muted" style="font-size:.75rem">Peşin ödenen ${tl(g.pd)}</div>`:''}</td><td class="r">${g.T<0?'-'+tl(-g.T):tl(g.T)}</td><td class="r">${tl(m.bal)}</td><td></td></tr>`};
 const list=[...L.mv].reverse().slice(0,S.tsAll?500:8);
 return `<div class="card tdborc"><div class="row" style="gap:12px"><div class="tbk"><span>Güncel borç</span><b style="color:${L.bal>0?'var(--badTx)':L.bal<0?'var(--okTx)':'var(--tx)'}">${tl(Math.abs(L.bal))}${L.bal<0?' <small>alacak</small>':''}</b></div>${L.odT>0?`<div class="tbk bad"><span>Vadesi geçen</span><b>${tl(L.odT)}</b></div>`:''}${L.soon.length?`<div class="tbk"><span>En yakın vade</span><b style="font-size:1.05rem">${fdd(L.soon.sort((a,b)=>a.due<b.due?-1:1)[0].due+'T12:00')}</b></div>`:''}<span class="sp row" style="gap:8px">${L.bal>0&&s.phone?'':''}<button class="btn okb" onclick="supPay(${s.id})">Ödeme yap</button></span></div>
 ${L.mv.length?`<div class="tw" style="margin-top:12px"><table class="tbl"><thead><tr><th>Tarih</th><th>İşlem</th><th class="r">Tutar</th><th class="r">Borç</th><th></th></tr></thead><tbody>${list.map(row).join('')}</tbody></table></div>${L.mv.length>8?`<button class="btn sm" style="margin-top:8px" onclick="S.tsAll=!S.tsAll;render()">${S.tsAll?'Daha az göster':'Tüm hareketler ('+L.mv.length+')'}</button>`:''}`:'<p class="muted" style="margin:10px 0 0">Henüz borç hareketi yok. Mal alışında ödeme şeklini "Borç" seçince burada görünür.</p>'}</div>`}

const mk=p=>p.cost>0?(p.price-p.cost)/p.cost*100:null;
const pct=v=>v==null?'—':'%'+String(Math.round(v*10)/10).replace('.',',');
function niceUp(v){const st=v<10?.25:v<100?.5:1;return r2(Math.ceil((v-1e-9)/st)*st)}
const sugPrice=p=>niceUp(p.cost*(1+KT().hedef/100));
function karDurum(p){const m=mk(p);if(m==null)return 'yok';if(p.price<p.cost)return 'zarar';if(m<KT().min)return 'dusuk';return 'iyi'}
function lastSoldMap(){const m={};D.sales.forEach(s=>{if(s.ret)return;s.items.forEach(l=>{if(!m[l.pid]||s.date>m[l.pid])m[l.pid]=s.date})});return m}
function deadStock(days){const ls=lastSoldMap();const lim=new Date();lim.setDate(lim.getDate()-days);const L=lim.toISOString();
 const first={};D.purchases.forEach(b=>{if(b.pid&&(!first[b.pid]||b.date<first[b.pid]))first[b.pid]=b.date});
 return D.products.filter(p=>p.stock>0&&(!ls[p.id]||ls[p.id]<L)&&(!first[p.id]||first[p.id]<L||ls[p.id])).map(p=>({p,last:ls[p.id]||null,val:r2(p.stock*(p.cost||0))})).sort((a,b)=>b.val-a.val)}
function setKT(k,v){D.set[k]=Math.max(0,num2(v));save();render()}

function pgKar(){if(!S.kTab)S.kTab='uyari';const k=KT();const ps=D.products;
 const zr=ps.filter(p=>karDurum(p)==='zarar'),dk=ps.filter(p=>karDurum(p)==='dusuk');const ms=ps.map(mk).filter(v=>v!=null);const ort=ms.length?ms.reduce((a,b)=>a+b,0)/ms.length:0;
 const dd=deadStock(S.kDead||60);const ddT=dd.reduce((a,x)=>a+x.val,0);
 const kpi=(l,v,c,go)=>`<button class="kpi kbtn" ${go?`onclick="${go}"`:''}><span>${l}</span><b style="${c?'color:'+c:''}">${v}</b></button>`;
 let body='';

/* SKT: mal alışındaki tarihlerden, eldeki stok en yeni partilere dağıtılarak (FIFO) hesaplanır */
function sktList(){const td=ymd(new Date());const done=new Set(D.set.sktDone||[]);const byP={};
 D.purchases.forEach(b=>{if(b.pid&&!b.ret&&!isPayRec(b))(byP[b.pid]=byP[b.pid]||[]).push(b)});
 (D.set.sktMan||[]).forEach(m=>(byP[m.pid]=byP[m.pid]||[]).push({id:m.id,date:m.date,qty:m.qty,skt:m.skt,man:1}));
 const out=[];Object.entries(byP).forEach(([pid,bs])=>{const p=P(+pid);if(!p||p.stock<=0)return;if(!bs.some(b=>b.skt))return;let rem=p.stock;
  bs.sort((a,b)=>a.date<b.date?1:-1).forEach(b=>{const l=Math.min(rem,b.qty||0);rem-=l;if(b.skt&&l>0&&!done.has(b.id)){const g=Math.round((new Date(b.skt+'T12:00')-new Date(td+'T12:00'))/864e5);out.push({p,id:b.id,skt:b.skt,left:r2(l),gun:g,val:r2(l*(p.cost||0)),man:!!b.man})}})});
 return out.sort((a,b)=>a.gun-b.gun)}

 <div class="card"><div class="row">${seg([['yak','Yaklaşanlar'],['gec','Geçmiş'],['hep','Tümü']],f,'sktF')}<span class="muted sp" style="font-size:.82rem">SKT'yi mal alışında her satıra yazabilirsin. Kalan miktar tahminidir (eski parti önce satılır).</span></div>
 <div class="tw" style="margin-top:10px"><table class="tbl"><thead><tr><th>Ürün</th><th>SKT</th><th class="r">Kalan (tahmini)</th><th class="r">Değer</th><th></th></tr></thead><tbody>${ls.map(x=>`<tr><td><div class="row" style="flex-wrap:nowrap;gap:10px">${pimg(x.p,30)}<b>${esc(x.p.name)}</b></div></td><td><span class="tag ${x.gun<0?'t-iade':x.gun<=3?'t-Veresiye':'t-Kart'}">${fdd(x.skt+'T12:00')} · ${x.gun<0?(-x.gun)+' gün geçti':x.gun===0?'bugün':x.gun+' gün kaldı'}</span></td><td class="r">${qf(x.left,x.p.unit)}</td><td class="r">${tl(x.val)}</td><td class="r"><div class="row" style="flex-wrap:nowrap;gap:6px;justify-content:flex-end"><button class="btn sm" onclick="fireForm(${x.p.id},${x.left},'SKT geçti',${esc(JSON.stringify(x.id))})">Fire yaz</button><button class="btn sm" onclick="S.af=afNew();S.af.ret=true;S.af.pay='';afAddLine(${x.p.id});S.af.lines[S.af.lines.length-1].qty=${x.left};nav('alisF')">İade</button><button class="btn sm" onclick="sktDone(${esc(JSON.stringify(x.id))})" title="Satıldı ya da kontrol edildi, listeden kaldır">Tamam</button></div></td></tr>`).join('')||`<tr><td colspan="5" class="empty">${all.length?'Bu filtrede ürün yok.':'Henüz SKT girilmemiş. Mal alışında SKT sütununa tarih yaz ya da "+ SKT ekle"ye bas.'}</td></tr>`}</tbody></table></div></div>`}

function kampAct(k){if(!k.on)return false;const d=ymd(new Date());if(k.from&&d<k.from)return false;if(k.to&&d>k.to)return false;return true}
function kampHit(k,l){if(!l.pid||l.unreg)return false;if(k.scope==='kat')return l.cat===k.cat;if(k.scope==='marka')return !!l.brand&&l.brand===k.brand;return (k.pids||[]).includes(l.pid)}
function kampLbl(k){return k.type==='xy'?`${k.x} al ${k.y} öde`:k.type==='pct'?`%${String(k.pct).replace('.',',')} indirim`:`${tl(k.price)} özel fiyat`}
function campCalc(c){const out={rows:[],tot:0,by:{}};if(!c||c.ret||!c.items||!c.items.length||!D||!D.set)return out;const ks=KAMP().filter(kampAct);if(!ks.length)return out;
 const g={};c.items.forEach(l=>{if(l.mul||!l.pid||l.unreg)return;const x=(g[l.pid]=g[l.pid]||{q:0,v:0,price:l.price,l});x.q+=l.qty;x.v+=lineT(l)});
 const per={};
 for(const pid in g){const x=g[pid];let best=null;
  for(const k of ks){if(!kampHit(k,x.l))continue;let d=0;
   if(k.type==='xy'){if(x.l.unit==='kg'||!(k.x>k.y)||k.y<1)continue;d=Math.floor(x.q/k.x)*(k.x-k.y)*x.price}
   else if(k.type==='pct')d=x.v*Math.min(100,Math.max(0,k.pct||0))/100;
   else if(k.type==='fix'){if(k.price>0&&k.price<x.price)d=(x.price-k.price)*x.q}
   d=r2(Math.min(d,x.v));if(d>0&&(!best||d>best.d))best={k,d}}
  if(best){const r=(per[best.k.id]=per[best.k.id]||{id:best.k.id,n:best.k.name||kampLbl(best.k),amt:0});r.amt=r2(r.amt+best.d);out.by[pid]=best.k}}
 out.rows=Object.values(per);out.tot=r2(out.rows.reduce((a,r)=>a+r.amt,0));return out}

function debtAge(c){const ds=[];let pay=0;[...c.moves].sort((a,b)=>String(a.date).localeCompare(String(b.date))).forEach(m=>{if(m.a>0)ds.push({d:m.date,a:m.a});else pay+=-m.a});
 for(const x of ds){const u=Math.min(x.a,pay);x.a-=u;pay-=u}const open=ds.filter(x=>x.a>0.004);if(!open.length)return null;return Math.floor((Date.now()-new Date(open[0].date||open[0].d))/864e5)}

function phTrack(){if(!D||!CACHE.products)return;for(const p of D.products){const o=CACHE.products[String(p.id)];if(!o)continue;let a;try{a=JSON.parse(o)}catch(e){continue}

 return `<details class="pkb"><summary>Fiyat geçmişi <span class="muted" style="font-weight:500">(${ph.length} değişiklik · ${bs.length} alış)</span></summary><div style="margin-top:10px;display:flex;flex-direction:column;gap:10px">

 const rows=Object.entries(m).sort((a,b)=>b[1].t-a[1].t);const tot=rows.reduce((a,r)=>a+r[1].t,0)||1;if(!rows.length)return '';

function pgKZ(){const now=new Date();const y=S.kzY||now.getFullYear();const ms=kzYear(y),pm=kzYear(y-1);const sum=(a,k)=>a.reduce((x,m)=>x+m[k],0);
 const lastM=y===now.getFullYear()?now.getMonth():11;const T=k=>sum(ms,k),PT=k=>sum(pm.slice(0,lastM+1),k);
 const chg=(v,p)=>{if(!p)return '';const r=Math.round((v-p)/Math.abs(p)*100);return `<small class="${r>=0?'up':'dn'}">${r>=0?'▲':'▼'} %${Math.abs(r)} <span style="color:var(--tx3);font-weight:500">geçen yılın aynı dönemine göre</span></small>`};
 const kpi=(l,v,c,ch)=>`<div class="kpi"><span>${l}</span><b style="${c?'color:'+c:''}">${v}</b>${ch||''}</div>`;
 const mx=Math.max(1,...ms.map(m=>Math.max(m.ciro,Math.abs(m.net))),...pm.map(m=>Math.abs(m.net)));const W=720,H=230,pb=24,pt=16,cw=(W-16)/12;const z=H-pb-(H-pb-pt)*0.15;const sc=v=>(v/mx)*(z-pt);
 let g=`<svg viewBox="0 0 ${W} ${H}" class="zch" style="height:230px" preserveAspectRatio="none"><line x1="8" x2="${W-8}" y1="${z}" y2="${z}" style="stroke:var(--line2)"/>`;

 <label class="f">Ödenen tutar<input class="in" id="kpa" inputmode="decimal" value="${s.stmt?String(s.stmt).replace('.',','):''}" autofocus onkeydown="if(event.key==='Enter')cardPayOk(${id})"></label>

 ${(kDay(ymd(new Date()))||{}).open?`<label class="row" style="gap:10px;cursor:pointer;flex-wrap:nowrap"><input type="checkbox" class="tck" id="kpk"><span>Kasadan nakit ödendi (kasadan para çıkışı yaz)</span></label>`:''}

 CMV().push({id:nid(),cid:id,kind:'odeme',amt:r2(v),date:d===ymd(new Date())?new Date().toISOString():new Date(d+'T12:00').toISOString(),note,user:S.user?S.user.name:''});
 const kb=$('#kpk');if(kb&&kb.checked&&d===ymd(new Date())){const r=kDay(ymd(new Date()));(r.moves=r.moves||[]).push({id:nid(),a:-r2(v),n:'Kart ödemesi: '+c.name,t:new Date().toISOString(),u:S.user?S.user.name:''})}
 save();closeM();render();toast(tl(v)+' ödeme kaydedildi')}

 modal(mHead('Harcama ekle · '+esc(c.name))+`<p class="muted" style="margin:0;font-size:.85rem">Mal alışı, tedarikçi ödemesi ve giderlerde kartı seçersen buraya kendiliğinden gelir. Bunu başka harcamalar için kullan.</p>

 CMV().push({id:nid(),cid:id,kind:'harcama',amt:r2(v),tk:+$('#kst').value||1,date:d===ymd(new Date())?new Date().toISOString():new Date(d+'T12:00').toISOString(),note:$('#ksn').value.trim()||'Harcama'});save();closeM();render();toast('Harcama eklendi')}

function kkHome(){const cs=CARDS();if(!cs.length)return '';const sts=cs.map(c=>[c,cardState(c)]).sort((a,b)=>(b[1].stmt>0)-(a[1].stmt>0)||a[1].due-b[1].due);const tot=r2(sts.reduce((a,[,s])=>a+s.toplam,0));
 return `<div class="card"><div class="row"><h2>Kredi kartları</h2><span class="muted" style="font-size:.85rem">Toplam borç <b style="color:var(--badTx)">${tl(tot)}</b></span><a href="#" class="sp" style="font-size:.85rem;font-weight:700;color:var(--acc)" onclick="event.preventDefault();nav('kkart')">Tümü</a></div>
 ${sts.map(([c,s])=>`<div class="row" style="flex-wrap:nowrap;padding:8px 0;border-top:1px solid var(--line);gap:10px"><div style="flex:1;min-width:0"><b>${esc(c.name)}</b><div class="muted" style="font-size:.8rem">${s.stmt>0?'Son ödeme '+fdl(s.due):'Sıradaki ekstre '+tl(s.nxt)+', son ödeme '+fdl(s.nDue)} · toplam ${tl(s.toplam)}</div></div><div style="text-align:right"><b style="color:${s.stmt>0?'var(--badTx)':'var(--okTx)'}">${tl(s.stmt)}</b><div>${dueTag(s)}</div></div><button class="btn sm" onclick="cardPay(${c.id})">Öde</button></div>`).join('')}</div>`}
function kkAlerts(rows){CARDS().forEach(c=>{const s=cardState(c);if(s.gec>0)rows.unshift(['t-iade',`${esc(c.name)}: ${tl(s.gec)} kart borcunun son ödeme tarihi geçti`,`cardPay(${c.id})`,'Ödeme yap']);else if(s.stmt>0&&s.days<=3)rows.unshift(['t-Veresiye',`${esc(c.name)}: ${tl(s.stmt)} kart borcu, son ödeme ${s.days===0?'bugün':s.days===1?'yarın':s.days+' gün sonra'} (${fdl(s.due)})`,`cardPay(${c.id})`,'Ödeme yap'])})}

/* ---------- ödemeler: düzenli ödemeler + kart ekstreleri (v3.12) ---------- */
function BILLS(){if(!Array.isArray(D.set.bills))D.set.bills=[];return D.set.bills}
function BPAID(){if(!Array.isArray(D.set.billPaid))D.set.billPaid=[];return D.set.billPaid}
const billById=id=>BILLS().find(b=>b.id===id);
const FREQ=[['ay','Her ay'],['3ay','3 ayda bir'],['yil','Her yıl'],['tek','Bir kez']];
const BTPL=[['Bağkur','Bağkur/SGK','ay',{me:1}],['SGK primi','Bağkur/SGK','ay',{day:26,v:1}],['Kira','Kira','ay',{day:1}],['Elektrik','Elektrik','ay',{v:1}],['Su','Su','ay',{v:1}],['Doğalgaz','Doğalgaz','ay',{v:1}],['İnternet','İnternet','ay',{}],['Telefon','Telefon','ay',{v:1}],['Muhasebeci','Muhasebe','ay',{day:5}],['KDV','Vergi','ay',{day:28,v:1}],['Muhtasar','Vergi','ay',{day:26,v:1}],['Geçici vergi','Vergi','3ay',{day:17,v:1}],['Personel maaşı','Maaş','ay',{day:1}]];
function billDue(b,y,m){const dim=new Date(y,m+1,0).getDate();const sd=new Date(b.start+'T00:00').getDate();return new Date(y,m,b.me?dim:Math.min(sd,dim))}
function billOcc(b,from,to){const out=[];if(!b.start)return out;const st=new Date(b.start+'T00:00');
 if(b.freq==='tek'){out.push(st)}else{const step=b.freq==='3ay'?3:b.freq==='yil'?12:1;let y=st.getFullYear(),m=st.getMonth();let g=0;while(g++<400){const d=billDue(b,y,m);if(d>to)break;if(d>=from)out.push(d);m+=step;while(m>11){m-=12;y++}}}
 return out.filter(d=>d>=from&&d<=to&&d>=dOnly(st)).map(d=>{const key=ymd(d);const o=(b.ov||{})[key]||{};const due=o.d?new Date(o.d+'T00:00'):d;const pd=BPAID().find(p=>p.bid===b.id&&p.key===key);
  return {kind:'bill',b,key,due,amt:o.a!=null?o.a:(+b.amt||0),est:!!b.v&&o.a==null,skip:!!o.skip,paid:pd||null,moved:!!o.d}})}
function odItems(from,to){const t=dOnly(new Date());const out=[];BILLS().filter(b=>b.on!==false).forEach(b=>out.push(...billOcc(b,from,to)));
 CARDS().forEach(c=>{const s=cardState(c);if(s.stmt>0&&s.due>=from&&s.due<=to||s.gec>0)out.push({kind:'card',c,s,key:'c'+c.id,due:s.due,amt:s.stmt,paid:null,skip:false});
  if(s.nxt>0&&s.nDue>=from&&s.nDue<=to)out.push({kind:'card',c,s,key:'n'+c.id,due:s.nDue,amt:s.nxt,est:true,next:true,paid:null,skip:false})});
 return out.sort((a,b)=>a.due-b.due)}
function odName(x){return x.kind==='card'?esc(x.c.name)+(x.next?' · sıradaki ekstre':' · kart ekstresi'):esc(x.b.name)}
function odState(x){const t=dOnly(new Date());if(x.paid)return 'paid';if(x.skip)return 'skip';const d=Math.round((x.due-t)/864e5);return d<0?'late':d===0?'today':d<=7?'week':'later'}
function odTag(x){const st=odState(x);const d=Math.round((x.due-dOnly(new Date()))/864e5);
 return st==='paid'?`<span class="tag t-Nakit">Ödendi ${fdd(x.paid.date)}</span>`:st==='skip'?'<span class="tag">Atlandı</span>':st==='late'?`<span class="tag t-iade">${-d} gün gecikti</span>`:st==='today'?'<span class="tag t-iade">Bugün son gün</span>':`<span class="tag ${d<=3?'t-Veresiye':'t-Kart'}">${d===1?'Yarın':d+' gün kaldı'}</span>`}
function odRow(x,compact){const st=odState(x);const cat=x.kind==='card'?'Kredi kartı':x.b.cat||'';
 const act=x.kind==='card'?(x.next?'':`<button class="btn sm okb" onclick="cardPay(${x.c.id})">Öde</button>`):st==='paid'?`<button class="btn sm ghost" onclick="billUnpay(${x.b.id},'${x.key}')">Geri al</button>`:st==='skip'?`<button class="btn sm ghost" onclick="billEdit(${x.b.id},'${x.key}')">Düzenle</button>`:`<button class="btn sm okb" onclick="billPay(${x.b.id},'${x.key}')">Ödendi</button>${compact?'':`<button class="ib ghost" aria-label="Tarih ya da tutarı değiştir" title="Tarih / tutar değiştir" onclick="billEdit(${x.b.id},'${x.key}')">${ic('edit',16)}</button>`}`;
 return `<div class="odr ${st}"><div class="odd"><b>${x.due.getDate()}</b><small>${x.due.toLocaleDateString('tr-TR',{month:'short'})}</small></div><div style="flex:1;min-width:0"><b>${odName(x)}</b>${x.moved?' <span class="tag t-Veresiye" title="Tarihi değiştirildi">tarih değişti</span>':''}<div class="muted" style="font-size:.8rem">${esc(cat)}${x.kind==='bill'&&x.b.note?' · '+esc(x.b.note):''}</div></div><div class="oda"><b>${x.paid?tl(x.paid.amt):x.amt?tl(x.amt):'<span class="muted">tutar ?</span>'}</b>${x.est&&!x.paid?'<small class="muted">tahmini</small>':''}${odTag(x)}</div><div class="row" style="gap:4px;flex-wrap:nowrap">${act}</div></div>`}
function pgOdeme(){const tab=S.odTab||'liste';const t=dOnly(new Date());
 $('#main').innerHTML=head('Ödemeler',`<button class="btn" onclick="nav('kkart')">${ic('kart',16)} Kredi kartları</button><button class="btn pri" onclick="billForm()">+ Düzenli ödeme ekle</button>`)+`<div>${seg([['liste','Yaklaşan ödemeler'],['tanim','Düzenli ödemeler ('+BILLS().length+')'],['gecmis','Ödeme geçmişi']],tab,'odTabSet')}</div>`+(tab==='tanim'?odTanim():tab==='gecmis'?odGecmis():odListe())}
function odTabSet(v){S.odTab=v;render()}
function odListe(){const t=dOnly(new Date());const from=new Date(t.getFullYear(),t.getMonth()-6,1),to=addD(t,62);const all=odItems(from,to);
 const ms=new Date(t.getFullYear(),t.getMonth(),1),me=new Date(t.getFullYear(),t.getMonth()+1,0);
 const late=all.filter(x=>odState(x)==='late');const inM=all.filter(x=>x.due>=ms&&x.due<=me&&!x.skip&&!x.next);
 const inMd=d=>{const x=new Date(d);return x>=ms&&x<addD(me,1)};const pM=r2(BPAID().filter(p=>inMd(p.date)).reduce((a,p)=>a+p.amt,0))+r2(CMV().filter(m=>m.kind==='odeme'&&new Date(m.date)>=ms&&new Date(m.date)<=addD(me,1)).reduce((a,m)=>a+m.amt,0));
 const rem=r2(inM.filter(x=>!x.paid&&odState(x)!=='late').reduce((a,x)=>a+x.amt,0));
 const kpi=(l,v,c,sub)=>`<div class="kpi"><span>${l}</span><b style="${c?'color:'+c:''}">${v}</b>${sub?`<small class="muted">${sub}</small>`:''}</div>`;
 const grp=(l,xs)=>xs.length?`<div class="card"><div class="row"><h2>${l}</h2><span class="sp muted" style="font-size:.85rem">${tl(xs.reduce((a,x)=>a+(x.paid?0:x.amt),0))}</span></div>${xs.map(x=>odRow(x)).join('')}</div>`:'';
 const up=all.filter(x=>!x.paid&&!x.skip&&odState(x)!=='late');const done=all.filter(x=>(x.paid&&(x.due>=ms||inMd(x.paid.date)))||(x.skip&&x.due>=ms));
 if(!BILLS().length&&!CARDS().length)return `<div class="card" style="max-width:680px"><h2>Ödemelerini takip et</h2><p style="margin:0;line-height:1.6">Bağkur, vergi, kira, elektrik, muhasebeci gibi düzenli ödemelerini bir kez gir; her ay kendiliğinden listeye gelir. Son ödeme tarihi yaklaşınca Ana sayfada uyarı çıkar. Ödeyince "Ödendi" dersin, istersen giderlere de yazılır. Kredi kartı ekstreleri de burada görünür.</p><button class="btn pri" style="align-self:flex-start" onclick="billForm()">+ İlk düzenli ödemeyi ekle</button></div>`;
 return `<div class="kpis">${kpi('Bu ay ödenecek (kalan)',tl(rem))}${kpi('Bu ay ödenen',tl(pM),'var(--okTx)')}${kpi('Gecikmiş',tl(late.reduce((a,x)=>a+x.amt,0)),late.length?'var(--badTx)':'',late.length?late.length+' ödeme':'')}${kpi('Önümüzdeki 7 gün',tl(up.filter(x=>x.due<=addD(t,7)).reduce((a,x)=>a+x.amt,0)),'',up.filter(x=>x.due<=addD(t,7)).length+' ödeme')}</div>
 ${grp('Gecikmiş',late)}${grp('Bu hafta',up.filter(x=>x.due<=addD(t,7)))}${grp('Bu ay',up.filter(x=>x.due>addD(t,7)&&x.due<=me))}${grp('Sonra',up.filter(x=>x.due>me))}${grp('Bu ay ödenenler',done)}
 ${!all.length?'<div class="card"><div class="empty">Önümüzdeki 2 ayda ödeme yok.</div></div>':''}`}
function odTanim(){const bs=BILLS();if(!bs.length)return `<div class="card"><div class="empty">Henüz düzenli ödeme yok.</div></div>`;
 return `<div class="card"><div class="tw"><table class="tbl"><thead><tr><th>Ödeme</th><th>Kategori</th><th>Ne zaman</th><th class="r">Tutar</th><th>Nasıl ödenir</th><th></th></tr></thead><tbody>${bs.map(b=>{const sd=new Date(b.start+'T00:00');const when=b.freq==='tek'?fdd(sd):b.freq==='ay'?`Her ay ${b.me?'ay sonu':sd.getDate()+"'inde"}`:b.freq==='3ay'?`3 ayda bir, ${sd.getDate()}'inde (ilk ${fdd(sd)})`:`Her yıl ${sd.toLocaleDateString('tr-TR',{day:'numeric',month:'long'})}`;
  return `<tr class="click${b.on===false?' muted':''}" onclick="billForm(${b.id})"><td><b>${esc(b.name)}</b>${b.on===false?' <span class="tag">Durduruldu</span>':''}${b.note?`<div class="muted" style="font-size:.78rem">${esc(b.note)}</div>`:''}</td><td>${esc(b.cat||'')}</td><td>${when}</td><td class="r">${b.amt?tl(b.amt):'—'}${b.v?' <small class="muted">değişken</small>':''}</td><td>${billHowTxt(b.how)}</td><td class="r"><button class="btn sm" onclick="event.stopPropagation();billForm(${b.id})">Düzenle</button></td></tr>`}).join('')}</tbody></table></div></div>`}
function billHowTxt(h){if(!h)return 'Nakit / banka';if(h==='Kasa')return 'Kasadan nakit';if(h==='Banka')return 'Banka';const c=cardById(+h);return c?'💳 '+esc(c.name):'—'}
function odGecmis(){const rows=[...BPAID().map(p=>{const b=billById(p.bid);return {d:p.date,n:b?b.name:'(silinmiş ödeme)',c:b?b.cat:'',a:p.amt,h:billHowTxt(p.how),p}}),...CMV().filter(m=>m.kind==='odeme').map(m=>{const c=cardById(m.cid);return {d:m.date,n:(c?c.name:'Kart')+' · kart ödemesi',c:'Kredi kartı',a:m.amt,h:m.note||''}})].sort((a,b)=>a.d<b.d?1:-1);
 const bm={};rows.forEach(r=>{const k=String(r.d).slice(0,7);bm[k]=(bm[k]||0)+r.a});
 if(!rows.length)return `<div class="card"><div class="empty">Henüz ödeme yok.</div></div>`;
 return `<div class="card"><h2>Aylara göre</h2><div class="row" style="gap:8px">${Object.entries(bm).slice(0,12).map(([k,v])=>`<span class="chip">${new Date(k+'-01T00:00').toLocaleDateString('tr-TR',{month:'long',year:'numeric'})}: <b>${tl(v)}</b></span>`).join('')}</div></div>
 <div class="card"><div class="tw"><table class="tbl"><thead><tr><th>Tarih</th><th>Ödeme</th><th>Kategori</th><th>Nasıl</th><th class="r">Tutar</th></tr></thead><tbody>${rows.slice(0,300).map(r=>`<tr><td>${fdd(r.d)}</td><td><b>${esc(r.n)}</b></td><td>${esc(r.c||'')}</td><td>${r.h}</td><td class="r"><b>${tl(r.a)}</b></td></tr>`).join('')}</tbody></table></div></div>`}

 <p class="muted" style="margin:-4px 0 0;font-size:.8rem;line-height:1.5">${b.freq==='ay'?'Sonraki aylar aynı güne gelir.':b.freq==='3ay'?'Her 3 ayda bir aynı güne gelir (örn. geçici vergi).':b.freq==='yil'?'Her yıl aynı güne gelir.':''} Tarih kayarsa listeden o ayın tarihini değiştirirsin.</p>

 <div class="g2"><label class="f">Genelde nasıl ödenir<select class="in" onchange="_bf.how=this.value">${[['','Nakit / banka'],['Kasa','Kasadan nakit'],['Banka','Banka'],...CARDS().map(c=>[String(c.id),'💳 '+c.name])].map(([v,l])=>`<option value="${v}" ${String(b.how||'')===v?'selected':''}>${esc(l)}</option>`).join('')}</select></label><label class="f">Not<input class="in" value="${esc(b.note||'')}" placeholder="örn. abone no" oninput="_bf.note=this.value"></label></div>
 <label class="row" style="gap:10px;cursor:pointer;flex-wrap:nowrap"><input type="checkbox" class="tck" ${b.gider!==false?'checked':''} onchange="_bf.gider=this.checked"><span>Ödeyince giderlere de yaz <span class="muted">(kâr-zarar raporuna girer)</span></span></label>

 const lim=ymd(addD(new Date(),-14));Object.keys(td).forEach(d=>{if(d<lim)delete td[d]});save()}
function taskToday(t){if(t.who&&S.user&&t.who!==S.user.id&&!isY())return false;const ti=todayIx();const td=ymd(new Date());
 if(t.rep==='gun')return true;if(t.rep==='hafta')return (t.days||[]).includes(ti);if(t.rep==='tek')return t.date===td||(t.date<td&&!t.doneAt);return false}

 return Object.entries(g).map(([c,ps])=>({id:'low:'+c,auto:1,cat:c,ps:ps.sort((a,b)=>a.stock-b.stock)})).sort((a,b)=>b.ps.length-a.ps.length)}

 return `<div class="card gvc"><div class="row"><h2>Bugün yapılacaklar</h2>${n?`<span class="tag ${open.length?'t-Kart':'t-Nakit'}">${fin.length} / ${n}</span>`:''}${isY()?`<button class="btn sm sp" onclick="gvForm()">+ Görev ekle</button>`:''}</div>

 ask(`${tl(-m.a)} tahsilat geri alınsın mı? ${esc(c.name)} adlı müşterinin borcu ${tl(bal(c))} → ${tl(r2(bal(c)-m.a))} olur.`,()=>{c.moves.splice(i,1);save();toast('Tahsilat geri alındı');custDet(cid);if(S.page==='musteri')pgMusteri()})}
/* satış ekranında fiyat değiştir */
function linePrice(i){const go=()=>{const l=C().items[i];if(!l)return;const p=P(l.pid);
 modal(mHead('Fiyatı değiştir')+`<div><b>${esc(l.name)}</b><div class="muted" style="font-size:.85rem">Kayıtlı fiyat: ${tl(p?(l.mul?(p.packPrice||p.price*p.pack):p.price):l.price)}${l.unit==='kg'?' / kg':''}</div></div>
 <label class="f">Bu satıştaki fiyat${l.unit==='kg'?' (kg)':''}<input class="in" id="lpv" inputmode="decimal" autofocus value="${String(l.price).replace('.',',')}" style="font-size:1.4rem;font-weight:800" onfocus="this.select()" onkeydown="if(event.key==='Enter')linePriceOk(${i})"></label>
 ${p&&isY()&&!l.mul&&!l.unreg?`<label class="row" style="gap:10px;cursor:pointer;flex-wrap:nowrap"><input type="checkbox" class="tck" id="lpk"><span>Ürünün fiyatını da kalıcı olarak değiştir</span></label>`:''}
 <div class="row"><button class="btn sp" onclick="closeM()">Vazgeç</button><button class="btn pri" onclick="linePriceOk(${i})">Uygula</button></div>`)};
 if(!isY()&&!D.set.cashDisc)askPw('Fiyat değiştirmek için yönetici onayı gerekiyor.',go);else go()}
function linePriceOk(i){const l=C().items[i];const v=num2($('#lpv').value);if(!(v>0)){toast('Fiyatı yaz');return}l.price=r2(v);const k=$('#lpk');if(k&&k.checked){const p=P(l.pid);if(p){p.price=r2(v);save();toast('Ürünün fiyatı kalıcı olarak değişti')}}else toast('Bu satış için fiyat değişti');closeM();drawCart()}
/* parçalı ödeme */
const SPK=[['Nakit','💵 Nakit'],['Kart','💳 Kart'],['Havale','🏦 Havale'],['Veresiye','📒 Veresiye']];
function split(){const c=C(),t=cartTot(c);if(!c.items.length){toast('Sepet boş');return}window._sp2={tot:t.total,v:{Nakit:'',Kart:'',Havale:'',Veresiye:''}};spDraw()}
function spDraw(){const s=window._sp2;const c=C();const cu=c.cust?D.customers.find(x=>x.id===c.cust):null;
 modal(mHead('Parçalı ödeme')+`<div class="row"><span class="muted">Toplam</span><b class="sp" style="font-size:1.5rem">${tl(s.tot)}</b></div>
 ${SPK.map(([k,l])=>`<div class="sprow"><span>${l}</span><input class="in" id="sp_${k}" inputmode="decimal" placeholder="0" value="${s.v[k]}" oninput="_sp2.v.${k}=this.value;spCalc()" onkeydown="if(event.key==='Enter')okSplit()"><button type="button" class="btn sm" onclick="spRest('${k}')">Kalanı</button></div>`).join('')}
 ${cu?`<p class="muted" style="margin:0;font-size:.82rem">Veresiye kısmı <b>${esc(cu.name)}</b> hesabına yazılır (borcu ${tl(bal(cu))}).</p>`:`<p class="muted" style="margin:0;font-size:.82rem">Veresiye kullanacaksan önce <a href="#" onclick="event.preventDefault();closeM();pickCust()">müşteri seç</a>.</p>`}
 <div id="spst" class="spst"></div>
 <button class="btn pri" style="min-height:52px" onclick="okSplit()">Ödemeyi tamamla</button>`);spCalc();setTimeout(()=>{const i=$('#sp_Nakit');if(i)i.focus()},40)}
function spSum(){const s=window._sp2;return r2(SPK.reduce((a,[k])=>a+num2(s.v[k]||0),0))}
function spCalc(){const s=window._sp2;const rem=r2(s.tot-spSum());const e=$('#spst');if(!e)return;e.className='spst '+(Math.abs(rem)<0.01?'ok':rem<0?'bad':'');e.innerHTML=Math.abs(rem)<0.01?'✓ Tutar tamam':rem>0?`Kalan: <b>${tl(rem)}</b>`:`Fazla girildi: <b>${tl(-rem)}</b>`}
function spRest(k){const s=window._sp2;s.v[k]='';const rem=r2(s.tot-spSum());if(rem<=0){toast('Kalan yok');return}s.v[k]=String(rem).replace('.',',');$('#sp_'+k).value=s.v[k];spCalc()}
function okSplit(){const s=window._sp2;const c=C();const parts={};SPK.forEach(([k])=>{const v=r2(num2(s.v[k]||0));if(v>0)parts[k]=v});const sum=r2(Object.values(parts).reduce((a,b)=>a+b,0));
 if(Math.abs(sum-s.tot)>=0.01){toast(sum<s.tot?'Parçaların toplamı eksik: '+tl(r2(s.tot-sum)):'Parçaların toplamı fazla: '+tl(r2(sum-s.tot)));return}
 if(parts.Veresiye&&!c.cust){toast('Veresiye için önce müşteri seç');return}
 if(Object.keys(parts).length===1){closeM();pay(Object.keys(parts)[0]);return}
 if(parts.Veresiye&&!c.ret){const cu=D.customers.find(x=>x.id===c.cust);if(cu.limit&&bal(cu)+parts.Veresiye>cu.limit&&!s.lim){s.lim=1;ask(cu.name+' için veresiye limiti aşılıyor ('+tl(cu.limit)+'). Yine de devam edilsin mi?',()=>{closeM();pay('Parçalı',parts)});return}}
 closeM();pay('Parçalı',parts)}
const partsTxt=p=>Object.entries(p||{}).filter(([,v])=>v).map(([k,v])=>k+' '+tl(v)).join(' / ');
/* ayarlar sekmeleri */
const AYT=[['genel','Genel'],['satis','Satış ve kasa'],['kisi','Kişiselleştirme'],['yedek','Yedekleme']];
const AYMAP=['genel','genel','satis','satis','satis','kisi','yedek'];
function ayTabSet(v){S.ayTab=v;render()}
function ayApply(){const tab=S.ayTab||'genel';const g=$('#main .ayg');if(!g)return;[...g.children].forEach((el,i)=>{el.style.display=(AYMAP[i]||'genel')===tab?'':'none'})}
/* kategori / marka satış grafiği */
const CATCOL=['#2563EB','#16A34A','#E8590C','#7C3AED','#DB2777','#0891B2','#CA8A04','#DC2626','#4B5563','#65A30D'];
function catSales(ss,by){const m={};ss.forEach(s=>{const sg=s.ret?-1:1;s.items.forEach(l=>{const k=(by==='brand'?l.brand:l.cat)||(by==='brand'?'(Markasız)':'(Kategorisiz)');const x=(m[k]=m[k]||{c:0,k:0,q:0});x.c+=lineT(l)*sg;x.k+=(lineT(l)-l.qty*(l.cost||0))*sg;x.q+=l.qty*sg})});
 return Object.entries(m).filter(([,v])=>v.c>0.004).sort((a,b)=>b[1].c-a[1].c)}
function catChart(ss,by,title,lim){const rows=catSales(ss,by);const tot=rows.reduce((a,[,v])=>a+v.c,0)||1;const top=rows.slice(0,lim||10);const rest=rows.slice(lim||10);if(rest.length)top.push(['Diğer ('+rest.length+')',rest.reduce((a,[,v])=>({c:a.c+v.c,k:a.k+v.k,q:a.q+v.q}),{c:0,k:0,q:0})]);
 if(!rows.length)return `<p class="muted" style="margin:0">Bu dönemde satış yok.</p>`;
 return `<div class="cstack">${top.map(([k,v],i)=>`<i style="width:${v.c/tot*100}%;background:${CATCOL[i%CATCOL.length]}" title="${esc(k)}: ${tl(v.c)} · %${Math.round(v.c/tot*100)}"></i>`).join('')}</div>
 <div class="clist2">${top.map(([k,v],i)=>`<div class="crow2"><span class="cdot" style="background:${CATCOL[i%CATCOL.length]}"></span><span class="cn2">${esc(k)}</span><div class="cbar"><i style="width:${v.c/top[0][1].c*100}%;background:${CATCOL[i%CATCOL.length]}"></i></div><b>${tl(v.c)}</b><span class="cp">%${Math.round(v.c/tot*100)}</span><span class="ck" title="Kâr">${tl(v.k)}</span></div>`).join('')}</div>`}
function catCard(ss,lbl){const by=S.csBy||'cat';return `<div class="card"><div class="row"><h2>${lbl||'Ne sattık?'}</h2><div class="sp">${seg([['cat','Kategoriye göre'],['brand','Markaya göre']],by,'csBySet')}</div></div><div class="row muted" style="font-size:.78rem;justify-content:flex-end;gap:14px"><span>Ciro</span><span>Pay</span><span style="width:84px;text-align:right">Kâr</span></div>${catChart(ss,by)}</div>`}
function csBySet(v){S.csBy=v;render()}
showLoading();setTimeout(netFail,8000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
